[package]
name = "soul-zoo"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
crossbeam-channel = "0.5"
ratatui = "0.26"
crossterm = "0.27"
anyhow = "1.0"
urlencoding = "2.1"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
