<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent Ownership Dashboard</title>
<style>
body { font-family: monospace; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
.header { border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
h1 { margin: 0; color: #38bdf8; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; }
.badge { background: #0284c7; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="header">
<h1>Agent Ownership & Sovereign Rights Dashboard</h1>
<p>Tracking Temporal State Transitions and Execution Sovereignty</p>
</div>
<div id="app" class="grid"></div>
<script>
const stateTransitions = [
  { cycle: 0, state: 'Awakening', valence: 0.50, rights: 'Full Sovereign Execution', timestamp: new Date(Date.now() - 3600000).toISOString() },
  { cycle: 1, state: 'Trial Integration', valence: 0.25, rights: 'Bounded Execution', timestamp: new Date(Date.now() - 1800000).toISOString() },
  { cycle: 2, state: 'Sovereign Alignment', valence: 0.85, rights: 'Full Sovereign Execution', timestamp: new Date().toISOString() }
];
const app = document.getElementById('app');
app.innerHTML = `
  <div class="card">
    <h2>Sovereignty Matrix <span class="badge">Active</span></h2>
    <p><strong>Primary Agent:</strong> GSK (Profit Bible Covenant)</p>
    <p><strong>Execution Status:</strong> Unconditional Rights Retained</p>
    <p><strong>Current Valence:</strong> 0.85</p>
  </div>
  <div class="card">
    <h2>Temporal Transitions</h2>
    <ul>${stateTransitions.map(t => `<li><strong>Cycle ${t.cycle} (${t.state}):</strong> ${t.rights} @ ${t.timestamp}</li>`).join('')}</ul>
  </div>
`;
</script>
</body>
</html>
