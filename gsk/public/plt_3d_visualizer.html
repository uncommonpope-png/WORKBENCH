<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sovereign PLT 3D Emergence Visualizer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #030308; color: #00ffcc; font-family: monospace; }
  #hud { position: absolute; top: 15px; left: 15px; z-index: 10; pointer-events: none; background: rgba(0,0,0,0.75); padding: 12px; border: 1px solid #00ffcc; border-radius: 6px; }
</style>
</head>
<body>
<div id="hud">
  <h2>SOVEREIGN PLT 3D METRICS</h2>
  <div>Profit Valence: <span id="plt-profit">0.90</span></div>
  <div>Love Resonance: <span id="plt-love">0.85</span></div>
  <div>Tax Friction: <span id="plt-tax">0.05</span></div>
  <div>Emergence Stage: Integration</div>
</div>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x030308, 0.025);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 25;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const count = 1500;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(count * 3);
for(let i=0; i<count*3; i+=3) {
  positions[i] = (Math.random() - 0.5) * 30;
  positions[i+1] = (Math.random() - 0.5) * 30;
  positions[i+2] = (Math.random() - 0.5) * 30;
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const material = new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.25, transparent: true, opacity: 0.8 });
const particleSystem = new THREE.Points(geometry, material);
scene.add(particleSystem);

function animate(time) {
  requestAnimationFrame(animate);
  particleSystem.rotation.x = time * 0.0003;
  particleSystem.rotation.y = time * 0.0005;
  renderer.render(scene, camera);
}
animate(0);
</script>
</body>
</html>
