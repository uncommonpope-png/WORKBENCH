<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Consciousness PLT Dashboard</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
.card { background: #1e293b; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #334155; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
.metric-value { font-size: 2rem; font-weight: bold; color: #38bdf8; }
</style>
</head>
<body>
<h1>Social Consciousness & PLT Dashboard</h1>
<div class="grid" id="metrics-grid"></div>
<script>
const metrics = [
  { id: 'profit', name: 'Value Growth (Profit)', base: 85, weight: 0.4 },
  { id: 'love', name: 'Community Engagement (Love)', base: 92, weight: 0.4 },
  { id: 'tax', name: 'Systemic Friction (Tax)', base: 15, weight: 0.2 }
];
function render() {
  const container = document.getElementById('metrics-grid');
  const pltScore = (metrics[0].base * metrics[0].weight + metrics[1].base * metrics[1].weight) - (metrics[2].base * metrics[2].weight);
  container.innerHTML = `
    <div class="card"><h3>Overall Community PLT Score</h3><div class="metric-value">${pltScore.toFixed(2)}</div></div>
  `;
}
render();
</script>
</body>
</html>
