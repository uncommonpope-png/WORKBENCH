<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sovereign PLT Identity Dashboard</title>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; padding: 20px; }
    .card { border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 16px; background: #161b22; }
    h1 { color: #58a6ff; }
    .metric-value { font-size: 1.5em; font-weight: bold; color: #7ee787; }
  </style>
</head>
<body>
  <h1>Sovereign PLT Identity Dashboard</h1>
  <div class="card">
    <h2>Real-time State</h2>
    <div>Mood: <span id="mood-val">neutral</span></div>
    <div>Valence: <span id="valence-val">0.00</span></div>
    <div>Arousal: <span id="arousal-val">0.00</span></div>
  </div>
  <div class="card">
    <h2>PLT Net Creation Metric</h2>
    <div class="metric-value" id="plt-net-value">+0.00</div>
  </div>
</body>
</html>
