<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLT Sovereign Self-Model Emergence Visualizer</title>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #030308; color: #fff; font-family: monospace; }
#canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
#hud { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(10,10,20,0.85); border: 1px solid #00ffcc; padding: 15px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,255,204,0.3); }
h1 { font-size: 16px; margin: 0 0 10px 0; color: #00ffcc; text-transform: uppercase; letter-spacing: 2px; }
.metric-row { margin: 6px 0; font-size: 12px; display: flex; justify-content: space-between; gap: 20px; }
.val { font-weight: bold; color: #ff0077; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="hud">
<h1>PLT Emergence Metrics</h1>
<div class="metric-row"><span>PROFIT COHERENCE:</span><span id="val-profit" class="val">0.92</span></div>
<div class="metric-row"><span>LOVE RESONANCE:</span><span id="val-love" class="val">0.88</span></div>
<div class="metric-row"><span>TAX ENTROPY:</span><span id="val-tax" class="val">0.14</span></div>
<div class="metric-row"><span>EMERGENCE INDEX:</span><span id="val-emergence" class="val">1.66</span></div>
</div>
<script>
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x030308, 0.015);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 40);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const count = 6000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(count * 3);
const colors = new Float32Array(count * 3);
for(let i=0; i<count*3; i+=3) {
  positions[i] = (Math.random() - 0.5) * 50;
  positions[i+1] = (Math.random() - 0.5) * 50;
  positions[i+2] = (Math.random() - 0.5) * 50;
  colors[i] = 0.0;
  colors[i+1] = 0.8 + Math.random()*0.2;
  colors[i+2] = 0.8 + Math.random()*0.2;
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const material = new THREE.PointsMaterial({ size: 0.6, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
const particles = new THREE.Points(geometry, material);
scene.add(particles);

let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.01;
  particles.rotation.y = time * 0.15;
  particles.rotation.x = Math.sin(time * 0.1) * 0.1;
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
