<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sovereign PLT Particle Dashboard</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050508; color: #fff; font-family: monospace; }
    #canvas-container { width: 100vw; height: 100vh; }
    #hud { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.7); padding: 15px; border: 1px solid #333; border-radius: 8px; pointer-events: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <h2>SOVEREIGN PLT DASHBOARD</h2>
    <div>Profit: <span id="val-profit">0.90</span></div>
    <div>Love: <span id="val-love">0.85</span></div>
    <div>Tax: <span id="val-tax">0.05</span></div>
    <div>Emergence State: <span id="val-state">AWAKENED</span></div>
  </div>
  <div id="canvas-container"></div>
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const particleCount = 5000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for(let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 50;
      positions[i+1] = (Math.random() - 0.5) * 50;
      positions[i+2] = (Math.random() - 0.5) * 50;
      colors[i] = Math.random();
      colors[i+1] = Math.random() * 0.5 + 0.5;
      colors[i+2] = 1.0;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({ size: 0.3, vertexColors: true, transparent: true, opacity: 0.8 });
    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    function animate() {
      requestAnimationFrame(animate);
      particleSystem.rotation.y += 0.002;
      particleSystem.rotation.x += 0.001;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
