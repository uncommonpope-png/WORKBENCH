<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLT Sovereign Telemetry Dashboard</title>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
  body { background: #030308; color: #00ffcc; overflow: hidden; height: 100vh; }
  #hud { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(5,10,20,0.85); padding: 20px; border: 1px solid #00ffcc; border-radius: 8px; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
  h1 { font-size: 1.2rem; margin-bottom: 10px; color: #ffffff; letter-spacing: 2px; }
  .metric { margin: 6px 0; font-size: 0.9rem; }
  .val { color: #ff0055; font-weight: bold; }
</style>
</head>
<body>
<div id="hud">
  <h1>PLT STATE TELEMETRY</h1>
  <div class="metric">VALENCE: <span class="val" id="valence-val">0.24</span></div>
  <div class="metric">AROUSAL: <span class="val" id="arousal-val">0.20</span></div>
  <div class="metric">MOOD: <span class="val" id="mood-val">NEUTRAL</span></div>
  <div class="metric">RESONANCE: <span class="val" id="res-val">0.35</span></div>
</div>
<canvas id="stage"></canvas>
<script>
const canvas = document.getElementById('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 6;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);

const geometry = new THREE.BufferGeometry();
const count = 1500;
const positions = new Float32Array(count * 3);
const colors = new Float32Array(count * 3);

for(let i = 0; i < count * 3; i += 3) {
  positions[i] = (Math.random() - 0.5) * 12;
  positions[i+1] = (Math.random() - 0.5) * 12;
  positions[i+2] = (Math.random() - 0.5) * 12;
  colors[i] = 0.0;
  colors[i+1] = 1.0;
  colors[i+2] = 0.8;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const material = new THREE.PointsMaterial({ size: 0.06, vertexColors: true });
const particleSystem = new THREE.Points(geometry, material);
scene.add(particleSystem);

function animate(t) {
  requestAnimationFrame(animate);
  particleSystem.rotation.y = t * 0.0003;
  particleSystem.rotation.x = Math.sin(t * 0.0002) * 0.2;
  renderer.render(scene, camera);
}
animate(0);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
