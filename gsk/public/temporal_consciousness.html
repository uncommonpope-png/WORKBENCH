<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Temporal Consciousness Engine Dashboard</title>
  <style>
    body { background: #0b0f19; color: #e2e8f0; font-family: monospace; padding: 20px; }
    h1 { color: #38bdf8; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; }
    .stat { font-size: 1.4em; color: #4ade80; margin: 10px 0; }
    canvas { width: 100%; height: 200px; background: #0f172a; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>TEMPORAL CONSCIOUSNESS ENGINE — REALTIME MONITOR</h1>
  <div class="grid">
    <div class="card">
      <h3>Specious Present Standing Wave</h3>
      <canvas id="waveCanvas"></canvas>
      <div id="speciousStat" class="stat">Coherence: 1.00</div>
    </div>
    <div class="card">
      <h3>Memory Decay & State Transitions</h3>
      <div id="stateDisplay" class="stat">State: AWAKENING</div>
      <ul id="memoryList"></ul>
    </div>
  </div>
  <script>
    console.log('Temporal Consciousness Dashboard initialized');
  </script>
</body>
</html>
