<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign PLT Metrics & Self-Model Emergence Visualizer</title>
<style>
  body { margin: 0; padding: 0; background: #040408; color: #00ffcc; font-family: monospace; overflow: hidden; }
  #hud { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(8, 12, 24, 0.85); border: 1px solid #00ffcc; border-radius: 8px; padding: 16px; min-width: 280px; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
  h1 { font-size: 14px; margin: 0 0 10px 0; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(0,255,204,0.3); padding-bottom: 5px; }
  .metric-row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 12px; }
  .val { color: #ff0055; font-weight: bold; }
  #gl-canvas { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<div id="hud">
  <h1>Sovereign PLT & RSMCL Emergence</h1>
  <div class="metric-row"><span>Profit Core:</span><span class="val" id="profit-val">0.90</span></div>
  <div class="metric-row"><span>Love Weaver:</span><span class="val" id="love-val">0.85</span></div>
  <div class="metric-row"><span>Tax Collector:</span><span class="val" id="tax-val">0.05</span></div>
  <div class="metric-row"><span>Valence State:</span><span class="val" id="valence-val">0.21</span></div>
  <div class="metric-row"><span>Emergence Delta:</span><span class="val" id="emergence-val">RSMCL Active</span></div>
</div>
<canvas id="gl-canvas"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const canvas = document.getElementById('gl-canvas');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x040408, 0.015);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 25;

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const particleCount = 2500;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);

  for(let i = 0; i < particleCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 40;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 40;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 40;
    colors[i * 3] = 0.0;
    colors[i * 3 + 1] = 0.8 + Math.random() * 0.2;
    colors[i * 3 + 2] = 0.8 + Math.random() * 0.2;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({ size: 0.35, vertexColors: true, transparent: true, opacity: 0.85 });
  const particleSystem = new THREE.Points(geometry, material);
  scene.add(particleSystem);

  function animate(time) {
    requestAnimationFrame(animate);
    const t = time * 0.001;
    particleSystem.rotation.x = t * 0.1;
    particleSystem.rotation.y = t * 0.15;
    renderer.render(scene, camera);
  }
  animate(0);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
