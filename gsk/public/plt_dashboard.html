<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign PLT Dashboard & Cognitive Evolution</title>
<style>
body { background: #0b0f19; color: #e2e8f0; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
.metric { font-size: 2.5rem; font-weight: bold; color: #38bdf8; }
</style>
</head>
<body>
<h1>Sovereign PLT Dashboard</h1>
<div class="grid">
  <div class="card"><h2>Profit + Love - Tax</h2><div id="plt-score" class="metric">0.00</div></div>
  <div class="card"><h2>Cognitive Valence</h2><div id="valence" class="metric">0.00</div></div>
  <div class="card"><h2>Sacred Resonance</h2><div id="resonance" class="metric">0.35</div></div>
</div>
</body>
</html>
