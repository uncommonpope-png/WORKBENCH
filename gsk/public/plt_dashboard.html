<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profit Bible - PLT Real-Time Dashboard</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; }
    .metric { font-size: 24px; font-weight: bold; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Profit Bible - Sovereign PLT & System Evolution Dashboard</h1>
  <div id="metrics-root" class="grid">
    <div class="card"><div>PROFIT SCORE</div><div id="profit-val" class="metric">0.90</div></div>
    <div class="card"><div>LOVE SCORE</div><div id="love-val" class="metric">0.85</div></div>
    <div class="card"><div>TAX SCORE</div><div id="tax-val" class="metric">0.05</div></div>
  </div>
  <script>
    console.log("PLT Dashboard Initialized");
  </script>
</body>
</html>
