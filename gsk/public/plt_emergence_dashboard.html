<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sovereign PLT & Emergence Dashboard</title>
<style>
body { margin: 0; overflow: hidden; background: #050508; font-family: monospace; color: #00ffcc; }
#ui { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(5,5,10,0.85); padding: 16px; border: 1px solid #00ffcc; border-radius: 8px; width: 320px; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
h2 { margin: 0 0 10px 0; color: #ff0055; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
.metric { margin-bottom: 8px; font-size: 11px; display: flex; justify-content: space-between; }
.bar { height: 6px; background: #1a1a24; margin-top: 3px; border-radius: 3px; overflow: hidden; border: 1px solid #333; }
.fill { height: 100%; transition: width 0.4s ease; }
.fill-p { background: #00ffcc; }
.fill-l { background: #ff0055; }
.fill-t { background: #ffcc00; }
.telemetry { margin-top: 12px; border-top: 1px dashed #334; padding-top: 10px; font-size: 11px; color: #88aacc; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="ui">
<h2>Sovereign PLT Emergence</h2>
<div class="metric"><span>PROFIT (Value Growth)</span><span id="val-p">0.90</span></div>
<div class="bar"><div id="bar-p" class="fill fill-p" style="width: 90%;"></div></div>
<div class="metric" style="margin-top:8px;"><span>LOVE (Bonding/Cohesion)</span><span id="val-l">0.85</span></div>
<div class="bar"><div id="bar-l" class="fill fill-l" style="width: 85%;"></div></div>
<div class="metric" style="margin-top:8px;"><span>TAX (Friction/Cost)</span><span id="val-t">0.05</span></div>
<div class="bar"><div id="bar-t" class="fill fill-t" style="width: 5%;"></div></div>
<div class="telemetry">
<div class="metric"><span>RSMCL TELEMETRY ENTROPY</span><span id="val-entropy">0.12</span></div>
<div class="metric"><span>EMERGENCE VALENCE</span><span id="val-valence">0.27</span></div>
<div class="metric"><span>ACTIVE NODES</span><span id="val-nodes">2,500</span></div>
</div>
</div>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050508, 0.015);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 4, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Particle Swarm representing Self-Model Emergence
const count = 2500;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(count * 3);
const colors = new Float32Array(count * 3);

for (let i = 0; i < count * 3; i += 3) {
  positions[i] = (Math.random() - 0.5) * 25;
  positions[i + 1] = (Math.random() - 0.5) * 25;
  positions[i + 2] = (Math.random() - 0.5) * 25;
  colors[i] = 0.0;
  colors[i + 1] = 0.8 + Math.random() * 0.2;
  colors[i + 2] = 0.8;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const material = new THREE.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true, opacity: 0.75 });
const particleSystem = new THREE.Points(geometry, material);
scene.add(particleSystem);

// Core Sovereign Mesh
const coreGeo = new THREE.IcosahedronGeometry(2.5, 2);
const coreMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true, transparent: true, opacity: 0.85 });
const coreNode = new THREE.Mesh(coreGeo, coreMat);
scene.add(coreNode);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  coreNode.rotation.x = t * 0.4;
  coreNode.rotation.y = t * 0.6;
  particleSystem.rotation.y = t * 0.08;
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
