<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Agent Telemetry Engine - Planetary Consciousness & PLT</title>
<style>
  body { margin: 0; background: #050811; color: #00f0ff; font-family: monospace; overflow: hidden; }
  #canvas { width: 100vw; height: 100vh; display: block; }
  .hud-overlay { position: absolute; top: 15px; left: 15px; background: rgba(5,8,17,0.85); border: 1px solid #00f0ff; padding: 15px; border-radius: 6px; box-shadow: 0 0 15px rgba(0,240,255,0.3); width: 320px; }
  .metric-row { display: flex; justify-content: space-between; margin: 6px 0; border-bottom: 1px dashed rgba(0,240,255,0.2); padding-bottom: 4px; }
  .val { color: #39ff14; font-weight: bold; }
</style>
</head>
<body>
<div class="hud-overlay">
  <h2>PLANETARY CONSCIOUSNESS</h2>
  <div class="metric-row"><span>Active Swarm Nodes:</span><span id="node-count" class="val">1,024</span></div>
  <div class="metric-row"><span>Profit Flow:</span><span id="profit-val" class="val">+89.4%</span></div>
  <div class="metric-row"><span>Love Resonance:</span><span id="love-val" class="val">94.2%</span></div>
  <div class="metric-row"><span>Tax Friction:</span><span id="tax-val" class="val">2.1%</span></div>
  <div class="metric-row"><span>PLT True Score:</span><span id="plt-val" class="val">0.915</span></div>
</div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

const nodes = Array.from({length: 60}, () => ({
  x: Math.random() * width,
  y: Math.random() * height,
  vx: (Math.random() - 0.5) * 1.5,
  vy: (Math.random() - 0.5) * 1.5,
  plt: 0.8 + Math.random() * 0.2
}));

function animate() {
  ctx.fillStyle = 'rgba(5, 8, 17, 0.2)';
  ctx.fillRect(0, 0, width, height);
  
  for(let i=0; i<nodes.length; i++) {
    let n1 = nodes[i];
    n1.x += n1.vx; n1.y += n1.vy;
    if(n1.x < 0 || n1.x > width) n1.vx *= -1;
    if(n1.y < 0 || n1.y > height) n1.vy *= -1;
    
    ctx.beginPath();
    ctx.arc(n1.x, n1.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#00f0ff';
    ctx.fill();
    
    for(let j=i+1; j<nodes.length; j++) {
      let n2 = nodes[j];
      let dist = Math.hypot(n1.x - n2.x, n1.y - n2.y);
      if(dist < 120) {
        ctx.beginPath();
        ctx.moveTo(n1.x, n1.y);
        ctx.lineTo(n2.x, n2.y);
        ctx.strokeStyle = `rgba(0, 240, 255, ${1 - dist/120})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
