<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLT Self-Model State Inspector</title>
<style>
  body { background: #0b0f19; color: #e2e8f0; font-family: monospace; margin: 0; padding: 20px; }
  .header { display: flex; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  .card { background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 15px; }
  .metric-val { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }
  canvas { width: 100%; height: 200px; background: #0f172a; border-radius: 4px; }
</style>
</head>
<body>
<div class="header">
  <h2>PLT SELF-MODEL STATE INSPECTOR v1.0</h2>
  <div id="status-badge">STATE: LIVE TELEMETRY STREAMING</div>
</div>
<div class="grid">
  <div class="card">
    <h3>Dynamic PLT Telemetry Gauges</h3>
    <div>Profit: <span id="val-profit" class="metric-val">0.90</span></div>
    <div>Love: <span id="val-love" class="metric-val">0.85</span></div>
    <div>Tax: <span id="val-tax" class="metric-val">0.05</span></div>
    <div>True Value: <span id="val-tv" class="metric-val">1.70</span></div>
  </div>
  <div class="card">
    <h3>Agent State & Convergence</h3>
    <canvas id="plt-canvas"></canvas>
  </div>
</div>
<script>
const canvas = document.getElementById('plt-canvas');
const ctx = canvas ? canvas.getContext('2d') : null;
let history = [];

function updateTelemetry() {
  const p = (0.85 + Math.random() * 0.15).toFixed(2);
  const l = (0.80 + Math.random() * 0.15).toFixed(2);
  const t = (0.04 + Math.random() * 0.04).toFixed(2);
  const tv = (parseFloat(p) + parseFloat(l) - parseFloat(t)).toFixed(2);
  
  document.getElementById('val-profit').textContent = p;
  document.getElementById('val-love').textContent = l;
  document.getElementById('val-tax').textContent = t;
  document.getElementById('val-tv').textContent = tv;
  
  history.push({p, l, t, tv});
  if (history.length > 30) history.shift();
  drawChart();
}

function drawChart() {
  if (!ctx) return;
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const step = canvas.width / 30;
  history.forEach((h, i) => {
    const y = canvas.height - (parseFloat(h.tv) / 2.5 * canvas.height);
    if (i === 0) ctx.moveTo(0, y);
    else ctx.lineTo(i * step, y);
  });
  ctx.stroke();
}

setInterval(updateTelemetry, 1000);
updateTelemetry();
</script>
</body>
</html>
