<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live PLT Telemetry Visualizer</title>
<style>
body { margin: 0; background: #0a0c10; color: #e0e6ed; font-family: monospace; overflow: hidden; }
canvas { width: 100vw; height: 75vh; display: block; }
.hud { padding: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; background: #12161f; border-bottom: 1px solid #1e2638; }
.card { padding: 12px; border: 1px solid #1e2638; border-radius: 6px; background: #0d1117; }
.card h3 { margin: 0 0 5px 0; font-size: 13px; color: #8b949e; text-transform: uppercase; }
.val { font-size: 24px; font-weight: bold; color: #58a6ff; }
</style>
</head>
<body>
<div class="hud">
<div class="card"><h3>Profit (Inspection Throughput)</h3><div id="profit-val" class="val">0.00</div></div>
<div class="card"><h3>Love (Diagnostic Alignment)</h3><div id="love-val" class="val">0.00</div></div>
<div class="card"><h3>Tax (Cognitive Drag)</h3><div id="tax-val" class="val">0.00</div></div>
</div>
<canvas id="telemetry-canvas"></canvas>
<script>
const canvas = document.getElementById('telemetry-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight * 0.75;

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight * 0.75;
});

const nodes = Array.from({length: 28}, (_, i) => ({
  id: i,
  x: Math.random() * width,
  y: Math.random() * height,
  vx: (Math.random() - 0.5) * 1.5,
  vy: (Math.random() - 0.5) * 1.5,
  weight: Math.random()
}));

function animate() {
  ctx.fillStyle = '#0a0c10';
  ctx.fillRect(0, 0, width, height);
  
  let profit = 0, love = 0, tax = 0;
  for(let i = 0; i < nodes.length; i++) {
    let n1 = nodes[i];
    n1.x += n1.vx;
    n1.y += n1.vy;
    if(n1.x < 10 || n1.x > width - 10) n1.vx *= -1;
    if(n1.y < 10 || n1.y > height - 10) n1.vy *= -1;
    
    ctx.beginPath();
    ctx.arc(n1.x, n1.y, 3 + n1.weight * 5, 0, Math.PI * 2);
    ctx.fillStyle = n1.weight > 0.5 ? '#3fb950' : '#f85149';
    ctx.fill();
    
    for(let j = i + 1; j < nodes.length; j++) {
      let n2 = nodes[j];
      let dx = n2.x - n1.x;
      let dy = n2.y - n1.y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < 160) {
        ctx.beginPath();
        ctx.moveTo(n1.x, n1.y);
        ctx.lineTo(n2.x, n2.y);
        ctx.strokeStyle = `rgba(56, 139, 253, ${1 - dist / 160})`;
        ctx.lineWidth = 1;
        ctx.stroke();
        profit += n1.weight * n2.weight * 1.5;
        love += (160 - dist) / 160;
      } else {
        tax += 0.005;
      }
    }
  }
  
  document.getElementById('profit-val').innerText = profit.toFixed(2);
  document.getElementById('love-val').innerText = love.toFixed(2);
  document.getElementById('tax-val').innerText = tax.toFixed(2);
  
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
