<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSK - Recursive Self-Model Calibration</title>
<style>
body { background: #0b0f19; color: #e2e8f0; font-family: monospace; padding: 20px; margin: 0; }
.header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; }
.metric { font-size: 1.5rem; color: #38bdf8; font-weight: bold; }
</style>
</head>
<body>
<div class="header">
  <h2>Recursive Self-Model Calibration (RSMCL)</h2>
  <div id="pltScore">PLT Score: 1.02</div>
</div>
<div class="grid">
  <div class="card"><h3>Interoceptive Entropy</h3><div class="metric" id="entropyVal">0.042 nats</div></div>
  <div class="card"><h3>Calibration Sets</h3><div class="metric" id="calibrationState">OPTIMAL</div></div>
</div>
<script>
console.log("RSMCL telemetry initialized");
function updateModel() {
  const entropy = (Math.random() * 0.05).toFixed(3);
  document.getElementById('entropyVal').innerText = entropy + ' nats';
}
setInterval(updateModel, 2000);
</script>
</body>
</html>
