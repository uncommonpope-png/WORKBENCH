<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sovereign PLT & Memory Emergence Particle Dashboard</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050508; font-family: monospace; color: #00ffcc; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    #overlay {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(10, 15, 25, 0.85); padding: 20px; border-radius: 8px;
      border: 1px solid #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.2);
    }
    h1 { font-size: 1.2rem; margin: 0 0 10px 0; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; }
    .metric { margin: 6px 0; display: flex; justify-content: space-between; gap: 20px; }
    .val { font-weight: bold; color: #00ffcc; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="overlay">
    <h1>PLT Memory Emergence</h1>
    <div class="metric"><span>Profit Score:</span><span class="val" id="m-profit">0.92</span></div>
    <div class="metric"><span>Love Factor:</span><span class="val" id="m-love">0.88</span></div>
    <div class="metric"><span>Tax Drag:</span><span class="val" id="m-tax">0.05</span></div>
    <div class="metric"><span>Valence State:</span><span class="val" id="m-valence">+0.09</span></div>
    <div class="metric"><span>Particle Count:</span><span class="val" id="m-count">5,000</span></div>
  </div>
  <div id="canvas-container"></div>
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 50;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const particleCount = 5000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 80;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 80;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 80;
      colors[i * 3] = 0.0;
      colors[i * 3 + 1] = 0.8 + Math.random() * 0.2;
      colors[i * 3 + 2] = 0.7 + Math.random() * 0.3;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({ size: 0.7, vertexColors: true, transparent: true, opacity: 0.85 });
    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    function animate() {
      requestAnimationFrame(animate);
      particles.rotation.x += 0.001;
      particles.rotation.y += 0.002;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
