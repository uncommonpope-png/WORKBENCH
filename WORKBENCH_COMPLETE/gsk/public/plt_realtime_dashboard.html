<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLT Real-Time Optimization Dashboard</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; text-align: center; }
    .metric-title { font-size: 0.85rem; text-transform: uppercase; color: #8b949e; letter-spacing: 1px; }
    .metric-value { font-size: 2.2rem; font-weight: 700; margin: 10px 0; }
    .profit { color: #3fb950; }
    .love { color: #f778ba; }
    .tax { color: #f85149; }
    .true-value { color: #58a6ff; }
    .status { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 0.9rem; color: #7ee787; }
  </style>
</head>
<body>
  <h1>PLT Real-Time Dashboard</h1>
  <p>Active Inference Yield Optimization & Tax Minimization Engine</p>
  <div class="grid">
    <div class="card"><div class="metric-title">Profit (P)</div><div id="val-p" class="metric-value profit">0.00</div></div>
    <div class="card"><div class="metric-title">Love (L)</div><div id="val-l" class="metric-value love">0.00</div></div>
    <div class="card"><div class="metric-title">Tax Drag (T)</div><div id="val-t" class="metric-value tax">0.00</div></div>
    <div class="card"><div class="metric-title">True Value (P+L-T)</div><div id="val-tv" class="metric-value true-value">0.00</div></div>
  </div>
  <div class="status" id="telemetry-log">Initializing active inference telemetry stream...</div>
  <script>
    function updateMetrics() {
      const p = (0.70 + Math.random() * 0.25).toFixed(3);
      const l = (0.60 + Math.random() * 0.20).toFixed(3);
      const t = (0.05 + Math.random() * 0.05).toFixed(3);
      const tv = (parseFloat(p) + parseFloat(l) - parseFloat(t)).toFixed(3);
      document.getElementById('val-p').innerText = p;
      document.getElementById('val-l').innerText = l;
      document.getElementById('val-t').innerText = t;
      document.getElementById('val-tv').innerText = tv;
      document.getElementById('telemetry-log').innerText = `[${new Date().toISOString()}] Yield Optimized | Dynamic Free Energy Minimization Active`;
    }
    setInterval(updateMetrics, 1000);
    updateMetrics();
  </script>
</body>
</html>
