<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLT Telemetry Dashboard & Live State Visualizer</title>
<style>
body { margin: 0; background: #0a0a0f; color: #00ffcc; font-family: monospace; display: flex; flex-direction: column; height: 100vh; }
header { padding: 15px; background: #12121a; border-bottom: 1px solid #00ffcc44; display: flex; justify-content: space-between; align-items: center; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; flex: 1; }
.card { background: #12121c; border: 1px solid #1a1a2e; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
.metric-title { font-size: 0.9rem; color: #8899ac; text-transform: uppercase; letter-spacing: 1px; }
.metric-value { font-size: 2rem; margin: 10px 0; color: #00ffcc; }
canvas { width: 100%; height: 200px; background: #08080c; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>PLT Telemetry Dashboard</h1>
  <div id="status">LIVE ENGINE ACTIVE</div>
</header>
<div class="grid">
  <div class="card">
    <div class="metric-title">Profit Vector (P)</div>
    <div class="metric-value" id="profit-val">0.942</div>
    <canvas id="profit-chart"></canvas>
  </div>
  <div class="card">
    <div class="metric-title">Love Alignment Vector (L)</div>
    <div class="metric-value" id="love-val">0.985</div>
    <canvas id="love-chart"></canvas>
  </div>
  <div class="card">
    <div class="metric-title">Tax / Occlusion (T)</div>
    <div class="metric-value" id="tax-val">0.012</div>
    <canvas id="tax-chart"></canvas>
  </div>
  <div class="card">
    <div class="metric-title">Net True Value (V = P + L - T)</div>
    <div class="metric-value" id="value-val">1.915</div>
    <canvas id="value-chart"></canvas>
  </div>
</div>
<script>
function initTelemetry() {
  function step() {
    const p = 0.9 + Math.random() * 0.08;
    const l = 0.95 + Math.random() * 0.04;
    const t = 0.01 + Math.random() * 0.01;
    const v = p + l - t;
    document.getElementById('profit-val').innerText = p.toFixed(4);
    document.getElementById('love-val').innerText = l.toFixed(4);
    document.getElementById('tax-val').innerText = t.toFixed(4);
    document.getElementById('value-val').innerText = v.toFixed(4);
    requestAnimationFrame(step);
  }
  step();
}
window.onload = initTelemetry;
</script>
</body>
</html>
