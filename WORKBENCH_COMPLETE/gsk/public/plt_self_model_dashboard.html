<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sovereign PLT & Self-Model Emergence Dashboard</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050508; font-family: monospace; color: #00ffcc; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    .hud-overlay { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(5,5,12,0.85); padding: 20px; border: 1px solid #00ffcc; border-radius: 8px; font-size: 13px; max-width: 380px; backdrop-filter: blur(10px); }
    .metric-bar { margin: 10px 0; }
    .bar-outer { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
    .bar-inner { height: 100%; width: 50%; transition: width 0.3s ease; }
    .profit-bg { background: #00ff88; }
    .love-bg { background: #ff007f; }
    .tax-bg { background: #ffaa00; }
    .self-bg { background: #00ccff; }
    h2 { margin-top: 0; font-size: 16px; letter-spacing: 1px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="hud-overlay">
    <h2>SOVEREIGN PLT &amp; SELF-MODEL TELEMETRY</h2>
    <div class="metric-bar">PROFIT (P): <span id="profit-val">0.85</span><div class="bar-outer"><div id="profit-bar" class="bar-inner profit-bg" style="width: 85%"></div></div></div>
    <div class="metric-bar">LOVE (L): <span id="love-val">0.72</span><div class="bar-outer"><div id="love-bar" class="bar-inner love-bg" style="width: 72%"></div></div></div>
    <div class="metric-bar">TAX (T): <span id="tax-val">0.14</span><div class="bar-outer"><div id="tax-bar" class="bar-inner tax-bg" style="width: 14%"></div></div></div>
    <div class="metric-bar">SELF-MODEL COHERENCE (RSMCL): <span id="self-val">0.94</span><div class="bar-outer"><div id="self-bar" class="bar-inner self-bg" style="width: 94%"></div></div></div>
    <div style="margin-top: 15px; font-size: 11px; opacity: 0.8;">STATUS: <span id="status-text">HOME OSTATIC ANCHOR ACTIVE</span></div>
  </div>
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const particleCount = 4000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 30;
      positions[i+1] = (Math.random() - 0.5) * 30;
      positions[i+2] = (Math.random() - 0.5) * 30;

      colors[i] = 0.0;
      colors[i+1] = 0.8 + Math.random() * 0.2;
      colors[i+2] = 0.8 + Math.random() * 0.2;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, transparent: true, opacity: 0.8 });
    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    camera.position.z = 20;

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();
      particles.rotation.y = elapsedTime * 0.1; stroke = elapsedTime * 0.05;
      particles.rotation.x = Math.sin(elapsedTime * 0.05) * 0.2;

      const pos = geometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        const idx = i * 3;
        pos[idx + 1] += Math.sin(elapsedTime + pos[idx]) * 0.01;
      }
      geometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
