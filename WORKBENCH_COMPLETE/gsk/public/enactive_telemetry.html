<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enactive Cognition Telemetry Visualizer</title>
<style>
body { background: #0b0f19; color: #e2e8f0; font-family: monospace; padding: 20px; }
.container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
canvas { width: 100%; height: 300px; background: #020617; border-radius: 4px; }
</style>
</head>
<body>
<h1>Enactive Cognition Telemetry Visualizer</h1>
<div class="container">
<div class="card">
<h2>PLT Value Stream</h2>
<canvas id="pltCanvas"></canvas>
</div>
<div class="card">
<h2>Agent Action Stream</h2>
<div id="actionLog"></div>
</div>
</div>
<script>
const canvas = document.getElementById('pltCanvas');
const ctx = canvas.getContext('2d');
let state = { profit: 0.9, love: 0.05, tax: 0.05, value: 0.9 };
function updateTelemetry(action, pltDelta) {
  state.profit += pltDelta.p || 0;
  state.love += pltDelta.l || 0;
  state.tax += pltDelta.t || 0;
  state.value = state.profit + state.love - state.tax;
  const log = document.getElementById('actionLog');
  if (log) log.innerHTML = `<div>[${new Date().toISOString()}] Action: ${action} | Net PLT: ${state.value.toFixed(3)}</div>` + log.innerHTML;
}
console.log('Enactive Telemetry Initialized');
</script>
</body>
</html>
