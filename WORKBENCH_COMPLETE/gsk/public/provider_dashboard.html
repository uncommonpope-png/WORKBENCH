<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provider Metrics Particle Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #050508; font-family: monospace; color: #00ffcc; }
  #hud { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(5,5,12,0.85); padding: 15px; border: 1px solid #00ffcc; border-radius: 6px; box-shadow: 0 0 15px rgba(0,255,204,0.2); width: 320px; }
  h2 { margin: 0 0 10px 0; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: #ffffff; border-bottom: 1px solid #333; padding-bottom: 5px; }
  .metric-row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 12px; }
  .val { color: #ff00ff; font-weight: bold; }
</style>
</head>
<body>
<div id="hud">
  <h2>Provider Telemetry</h2>
  <div id="metrics-list"></div>
</div>
<script>
// Scaffold initialized
const providers = [
  { name: 'OpenAI GPT-4o', usage: 1450, latency: 240, cost: 0.042, color: 0x00ffcc },
  { name: 'Anthropic Claude 3.5', usage: 980, latency: 180, cost: 0.035, color: 0xff00ff },
  { name: 'Google Gemini 1.5 Pro', usage: 1200, latency: 150, cost: 0.018, color: 0xffff00 },
  { name: 'DeepSeek V3', usage: 2100, latency: 110, cost: 0.008, color: 0x00ff88 }
];

const hudContainer = document.getElementById('metrics-list');
function updateHUD() {
  hudContainer.innerHTML = providers.map(p => `
    <div class="metric-row">
      <span>${p.name}:</span>
      <span class="val">${p.usage} req | ${p.latency}ms | $${p.cost.toFixed(3)}</span>
    </div>
  `).join('');
}
updateHUD();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 50;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const particleCount = 2000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 100;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 100;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
  colors[i * 3] = Math.random();
  colors[i * 3 + 1] = Math.random();
  colors[i * 3 + 2] = Math.random();
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({ size: 1.2, vertexColors: true });
const particles = new THREE.Points(geometry, material);
scene.add(particles);

function animate() {
  requestAnimationFrame(animate);
  particles.rotation.x += 0.001;
  particles.rotation.y += 0.002;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
