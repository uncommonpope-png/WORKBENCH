<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Model Drift & PLT Decision Boundaries</title>
<style>
  body { margin: 0; background: #0b0d13; color: #e2e8f0; font-family: monospace; padding: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { background: #131722; border: 1fr solid #2a2e3d; border-radius: 8px; padding: 15px; }
  h2 { margin-top: 0; color: #38bdf8; font-size: 16px; }
  canvas { width: 100%; height: 320px; background: #05070a; border-radius: 4px; display: block; }
</style>
</head>
<body>
<h1>Self-Model Drift & PLT Decision Boundary Telemetry</h1>
<div class="grid">
  <div class="card"><h2>Self-Model Latent Drift Vector</h2><canvas id="driftCanvas"></canvas></div>
  <div class="card"><h2>PLT Decision Boundary Heatmap</h2><canvas id="pltCanvas"></canvas></div>
</div>
<script>
const dCtx = document.getElementById('driftCanvas').getContext('2d');
const pCtx = document.getElementById('pltCanvas').getContext('2d');
let points = [];
for (let i = 0; i < 50; i++) points.push({x: Math.random()*300, y: Math.random()*300});
function draw() {
  dCtx.clearRect(0, 0, 300, 300);
  dCtx.strokeStyle = '#00f0ff'; dCtx.beginPath();
  points.forEach((p, idx) => { if(idx===0) dCtx.moveTo(p.x, p.y); else dCtx.lineTo(p.x, p.y); });
  dCtx.stroke();
  pCtx.fillStyle = '#10b981'; pCtx.fillRect(10, 10, 280, 280);
  pCtx.fillStyle = '#ef4444'; pCtx.fillRect(100, 100, 100, 100);
}
draw();
</script>
</body>
</html>
