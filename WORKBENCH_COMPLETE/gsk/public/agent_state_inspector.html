<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Time Agent State Inspector & PLT Telemetry</title>
<style>
  body { background: #0b0f19; color: #e2e8f0; font-family: monospace; margin: 0; padding: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { background: #1e293b; border: 1fr solid #334155; border-radius: 8px; padding: 16px; }
  h2 { margin-top: 0; color: #38bdf8; font-size: 1.1rem; }
  .stat-val { font-size: 1.8rem; font-weight: bold; color: #4ade80; }
</style>
</head>
<body>
<h1>GSK Sovereign Agent State Inspector</h1>
<div class="grid">
  <div class="card">
    <h2>PLT Value Balance (Profit / Love / Tax)</h2>
    <div id="plt-metrics" class="stat-val">P: 0.90 | L: 0.05 | T: 0.05</div>
  </div>
  <div class="card">
    <h2>Embodied Sensorimotor Telemetry</h2>
    <div id="embodied-state">State: ACTIVE_INFERENCE</div>
  </div>
</div>
<div id="inspector-tree" class="card" style="margin-top: 20px;">
  <h2>Live State Stream Inspection</h2>
  <pre id="state-log">Initializing telemetry feed...</pre>
</div>
<script>
const stateLog = document.getElementById('state-log');
const pltMetrics = document.getElementById('plt-metrics');
const embodiedState = document.getElementById('embodied-state');

let tick = 0;
function updateInspector() {
  tick++;
  const profit = (0.85 + Math.sin(tick * 0.1) * 0.1).toFixed(2);
  const love = (0.10 + Math.cos(tick * 0.1) * 0.04).toFixed(2);
  const tax = (0.05 + Math.sin(tick * 0.05) * 0.02).toFixed(2);
  const tv = (parseFloat(profit) + parseFloat(love) - parseFloat(tax)).toFixed(2);
  
  pltMetrics.textContent = `P: ${profit} | L: ${love} | T: ${tax} => TV: ${tv}`;
  embodiedState.textContent = `Interoception: NOMINAL | Closed-Loop Telemetry: ACTIVE | Tick: ${tick}`;
  
  const logEntry = `[${new Date().toISOString()}] AgentState #tick_${tick} -> Action: OPTIMIZE_PLT | Affinity: Profit Prime | TV=${tv}`;
  stateLog.textContent = logEntry + '\n' + stateLog.textContent.slice(0, 1000);
}

setInterval(updateInspector, 1000);
updateInspector();
</script>
</body>
</html>
