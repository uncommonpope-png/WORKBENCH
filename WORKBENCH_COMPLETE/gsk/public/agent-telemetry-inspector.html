<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Agent Telemetry Inspector</title>
<style>
body { font-family: monospace; background: #0a0a12; color: #00ffcc; margin: 0; padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #00ffcc; padding-bottom: 10px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.card { background: #121220; border: 1px solid #1a3a4a; padding: 15px; border-radius: 8px; }
</style>
</head>
<body>
<div class="header"><h1>LIVE AGENT TELEMETRY INSPECTOR</h1><div id="plt-score">PLT TV: --</div></div>
<div class="grid">
<div class="card" id="telemetry-panel"><h2>Interoceptive Vector Telemetry</h2><canvas id="telemetryCanvas" width="400" height="200"></canvas></div>
<div class="card" id="rsmcl-panel"><h2>Recursive Self-Model Calibration</h2><div id="rsmcl-state">Status: INITIALIZING...</div></div>
</div>
<script>
const state = { profit: 0.9, love: 0.8, tax: 0.2, score: 1.5 };
function updatePLT() {
  state.score = state.profit + state.love - state.tax;
  const scoreEl = document.getElementById('plt-score');
  if (scoreEl) scoreEl.innerText = `PLT TV: ${state.score.toFixed(2)}`;
}
setInterval(updatePLT, 1000);
console.log('Live Agent Telemetry Inspector active.');
</script>
</body>
</html>
