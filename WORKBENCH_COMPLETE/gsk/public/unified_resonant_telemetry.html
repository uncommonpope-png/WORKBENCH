<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unified Resonant Telemetry Dashboard</title>
<style>
  body { margin: 0; background: #0a0b10; color: #e2e8f0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { padding: 16px 24px; background: #121420; border-bottom: 1px solid #2d3748; display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0; font-size: 1.25rem; color: #6366f1; letter-spacing: 0.05em; }
  .badge { background: #1e1b4b; color: #818cf8; padding: 4px 12px; border-radius: 9999px; border: 1px solid #3730a3; font-size: 0.85rem; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 340px; flex: 1; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; background: radial-gradient(circle at center, #111322 0%, #0a0b10 100%); }
  .sidebar { background: #121420; border-left: 1px solid #2d3748; padding: 20px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0; }
  .card { background: #1a1d2d; padding: 14px; border-radius: 8px; border: 1px solid #2d3748; }
  .card h3 { margin: 0 0 8px 0; color: #a5b4fc; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .metric { font-size: 1.5rem; font-weight: 700; color: #f8fafc; }
  .subtext { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Panpsychic Telemetry Engine</h1>
  <div class="badge" id="plt-indicator">PLT Value Formula: Active</div>
</header>
<div class="grid">
  <canvas id="telemetryCanvas"></canvas>
  <div class="sidebar">
    <div class="card">
      <h3>Agent Telemetry Pulse</h3>
      <div class="metric" id="agentState">98.4 Hz</div>
      <div class="subtext">Micro-agent state frequency</div>
    </div>
    <div class="card">
      <h3>Bio-Acoustic Resonance</h3>
      <div class="metric" id="bioState">432.0 Hz</div>
      <div class="subtext">Harmonic biological alignment</div>
    </div>
    <div class="card">
      <h3>Planetary Rhythm</h3>
      <div class="metric" id="planetaryState">7.83 Hz</div>
      <div class="subtext">Schumann baseline oscillation</div>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('telemetryCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resize);
resize();

let time = 0;
function draw() {
  time += 0.02;
  ctx.fillStyle = '#0a0b10';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const baseRadius = Math.min(cx, cy) * 0.35;
  
  // 1. Planetary Macro-Rhythm Ring (7.83 Hz simulation)
  ctx.beginPath();
  ctx.arc(cx, cy, baseRadius * 1.5, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(99, 102, 241, 0.4)';
  ctx.lineWidth = 3;
  ctx.stroke();
  
  // 2. Bio-Acoustic Resonance Field (432 Hz waveform)
  ctx.beginPath();
  for (let i = 0; i <= 360; i += 2) {
    const rad = (i * Math.PI) / 180;
    const wave = Math.sin(rad * 12 + time * 4) * 18 + Math.cos(rad * 6 - time * 2) * 12;
    const r = baseRadius + wave;
    const x = cx + r * Math.cos(rad);
    const y = cy + r * Math.sin(rad);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  
  // 3. Synthetic Micro-Agent Swarm Orbiting Nodes
  for (let a = 0; a < 8; a++) {
    const angle = time * 0.8 + (a * Math.PI / 4);
    const nx = cx + (baseRadius * 0.75) * Math.cos(angle);
    const ny = cy + (baseRadius * 0.75) * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(nx, ny, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#f59e0b';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(nx, ny, 12, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(245, 158, 11, 0.2)';
    ctx.fill();
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
