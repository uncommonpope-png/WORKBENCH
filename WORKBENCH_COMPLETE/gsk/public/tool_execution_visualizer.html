<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real-Time Tool Execution Visualizer & PLT Value Tracker</title>
<style>
body { font-family: monospace; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
.header { border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
h1 { color: #38bdf8; margin: 0; font-size: 24px; }
.grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; }
.metric { font-size: 28px; font-weight: bold; color: #4ade80; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; font-size: 13px; }
th { color: #94a3b8; }
.plt-score { color: #facc15; font-weight: bold; }
</style>
</head>
<body>
<div class="header">
<h1>Real-Time Tool Execution Visualizer</h1>
<p>Agent Action Performance & PLT Value Dynamics Telemetry</p>
</div>
<div class="grid">
<div class="card">
<h3>Live Action Stream</h3>
<table>
<thead><tr><th>Time</th><th>Tool</th><th>Duration</th><th>Status</th><th>PLT Score</th></tr></thead>
<tbody id="log-body">
<tr><td>12:00:01</td><td>search_code</td><td>120ms</td><td>SUCCESS</td><td class="plt-score">+0.85</td></tr>
</tbody>
</table>
</div>
<div class="card">
<h3>Aggregate PLT Metrics</h3>
<div>Profit Score: <span class="metric" id="plt-val">0.92</span></div>
<p>Tax Risk: 0.05 | Love Resonance: 0.85</p>
</div>
</div>
</body>
</html>
