<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4-Gods PLT Economy Arbitrage Visualizer</title>
<style>
  body { background-color: #0b0f19; color: #e2e8f0; font-family: monospace; margin: 0; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .card { background: #1e293b; border: 1fr solid #334155; border-radius: 8px; padding: 16px; }
  .god-profit { border-left: 4px solid #eab308; }
  .god-love { border-left: 4px solid #ec4899; }
  .god-tax { border-left: 4px solid #ef4444; }
  .god-harvest { border-left: 4px solid #10b981; }
  h1 { color: #f8fafc; font-size: 1.5rem; }
  .metric { font-size: 1.25rem; font-weight: bold; margin-top: 8px; }
</style>
</head>
<body>
  <h1>4-Gods PLT Economy Arbitrage Dashboard</h1>
  <div class="grid">
    <div class="card god-profit"><h3>Profit Prime (0.9 / 0.05 / 0.05)</h3><div id="profit-arbitrage" class="metric">Arbitrage Score: --</div></div>
    <div class="card god-love"><h3>Love Weaver (0.1 / 0.85 / 0.05)</h3><div id="love-arbitrage" class="metric">Arbitrage Score: --</div></div>
    <div class="card god-tax"><h3>Tax Collector (0.05 / 0.05 / 0.9)</h3><div id="tax-arbitrage" class="metric">Arbitrage Score: --</div></div>
    <div class="card god-harvest"><h3>Harvester (0.4 / 0.3 / 0.3)</h3><div id="harvest-arbitrage" class="metric">Arbitrage Score: --</div></div>
  </div>
  <script>
    const councilGods = {
      profitPrime: { name: 'Profit Prime', p: 0.90, l: 0.05, t: 0.05 },
      loveWeaver: { name: 'Love Weaver', p: 0.10, l: 0.85, t: 0.05 },
      taxCollector: { name: 'Tax Collector', p: 0.05, l: 0.05, t: 0.90 },
      harvester: { name: 'Harvester', p: 0.40, l: 0.30, t: 0.30 }
    };
    function computePLTValue(p, l, t) { return p + l - t; }
    function updateArbitrageVisuals() {
      const pVal = (Math.random() * 0.5 + 0.5).toFixed(2);
      const lVal = (Math.random() * 0.4 + 0.4).toFixed(2);
      const tVal = (Math.random() * 0.2 + 0.05).toFixed(2);
      document.getElementById('profit-arbitrage').innerText = 'Net Value: ' + computePLTValue(parseFloat(pVal)*0.9, parseFloat(lVal)*0.05, parseFloat(tVal)*0.05).toFixed(3);
      document.getElementById('love-arbitrage').innerText = 'Net Value: ' + computePLTValue(parseFloat(pVal)*0.1, parseFloat(lVal)*0.85, parseFloat(tVal)*0.05).toFixed(3);
      document.getElementById('tax-arbitrage').innerText = 'Net Value: ' + computePLTValue(parseFloat(pVal)*0.05, parseFloat(lVal)*0.05, parseFloat(tVal)*0.90).toFixed(3);
      document.getElementById('harvest-arbitrage').innerText = 'Net Value: ' + computePLTValue(parseFloat(pVal)*0.4, parseFloat(lVal)*0.3, parseFloat(tVal)*0.3).toFixed(3);
    }
    setInterval(updateArbitrageVisuals, 2000);
    updateArbitrageVisuals();
  </script>
</body>
</html>
