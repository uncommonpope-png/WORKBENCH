<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Zero-Truncation Execution Harness</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #000; color: #0f0; font-family: monospace; }
  #telemetry { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #0f0; }
</style>
</head>
<body>
<div id="telemetry">Harness Initialized. Status: STANDBY</div>
<div id="canvas-container"></div>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const telemetry = document.getElementById('telemetry');
  try {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);
    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();
    telemetry.textContent = 'Harness Active | Verification: PASSED | Render Loop: RUNNING';
  } catch (err) {
    telemetry.textContent = 'Harness Error: ' + err.message;
  }
});
</script>
</body>
</html>
