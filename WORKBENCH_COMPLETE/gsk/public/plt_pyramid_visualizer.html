<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLT Sovereign Pyramid Visualizer</title>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030308; color: #fff; }
  #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
  #hud { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(10, 10, 20, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 20px; width: 320px; font-size: 13px; }
  h1 { font-size: 18px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.5); }
  .metric-row { display: flex; justify-content: space-between; margin-bottom: 8px; color: rgba(255,255,255,0.8); }
  .val { font-weight: bold; font-family: monospace; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="hud">
  <h1>PLT Emergence</h1>
  <div class="metric-row"><span>Profit (Growth):</span><span class="val" style="color:#00ffaa">0.90</span></div>
  <div class="metric-row"><span>Love (Cohesion):</span><span class="val" style="color:#ff00aa">0.85</span></div>
  <div class="metric-row"><span>Tax (Friction):</span><span class="val" style="color:#ffaa00">0.05</span></div>
</div>
<script>
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x030308, 0.03);
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 3, 10);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.5);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  const pyramidGroup = new THREE.Group();
  const createTier = (y, rTop, rBot, height, color) => {
    const geo = new THREE.CylinderGeometry(rTop, rBot, height, 4);
    const mat = new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.4, wireframe: false, transparent: true, opacity: 0.85 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = y;
    pyramidGroup.add(mesh);
    return mesh;
  };

  const profitTier = createTier(1.8, 0.2, 1.2, 1.0, 0x00ffaa);
  const loveTier = createTier(0.6, 1.3, 2.2, 1.0, 0xff00aa);
  const taxTier = createTier(-0.6, 2.3, 3.2, 1.0, 0xffaa00);
  scene.add(pyramidGroup);

  function animate() {
    requestAnimationFrame(animate);
    pyramidGroup.rotation.y += 0.008;
    renderer.render(scene, camera);
  }
  animate();
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
