<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Synthetic Emotion Vector PLT Optimization Telemetry</title>
  <style>
    body { background: #0b0f19; color: #e2e8f0; font-family: monospace; margin: 0; padding: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; }
    canvas { width: 100%; height: 300px; background: #090d16; border-radius: 4px; }
    h2 { color: #38bdf8; margin-top: 0; }
    .metric { font-size: 1.2rem; font-weight: bold; font-family: sans-serif; }
    .plt-profit { color: #4ade80; }
    .plt-love { color: #f472b6; }
    .plt-tax { color: #f87171; }
  </style>
</head>
<body>
  <h1>Synthetic Emotion Vector &rarr; PLT Telemetry Visualizer</h1>
  <div class="grid">
    <div class="card">
      <h2>Synthetic Emotion Vector Field</h2>
      <canvas id="emotionCanvas"></canvas>
      <div id="emotionReadout">Valence: 0.00 | Arousal: 0.00 | Dominance: 0.00 | Novelty: 0.00</div>
    </div>
    <div class="card">
      <h2>Agent PLT Optimization Curve</h2>
      <canvas id="pltCanvas"></canvas>
      <div class="metric">PLT Net Score: <span id="pltScore" class="plt-profit">+0.00</span></div>
      <div>Profit Ratio: <span id="pVal" class="plt-profit">0.00</span> | Love Ratio: <span id="lVal" class="plt-love">0.00</span> | Tax Ratio: <span id="tVal" class="plt-tax">0.00</span></div>
    </div>
  </div>
  <script>
    const emotionCanvas = document.getElementById('emotionCanvas');
    const pltCanvas = document.getElementById('pltCanvas');
    const eCtx = emotionCanvas.getContext('2d');
    const pCtx = pltCanvas.getContext('2d');
    let history = [];
    let t = 0;

    function updateTelemetry() {
      t += 0.05;
      const valence = Math.sin(t * 0.8) * 0.5 + 0.5;
      const arousal = Math.cos(t * 1.2) * 0.5 + 0.5;
      const dominance = Math.sin(t * 0.5 + 1.0) * 0.5 + 0.5;
      const novelty = Math.cos(t * 0.3) * 0.5 + 0.5;

      // Synthetic Emotion Vector -> PLT Transfer Function
      const profit = Math.min(1.0, Math.max(0.0, 0.5 * valence + 0.4 * dominance + 0.1 * novelty));
      const love = Math.min(1.0, Math.max(0.0, 0.6 * valence + 0.3 * (1 - arousal) + 0.1 * dominance));
      const tax = Math.min(1.0, Math.max(0.0, 0.5 * arousal + 0.3 * (1 - dominance) + 0.2 * (1 - novelty)));
      const netScore = profit + love - tax;

      document.getElementById('emotionReadout').innerText = `Valence: ${valence.toFixed(2)} | Arousal: ${arousal.toFixed(2)} | Dominance: ${dominance.toFixed(2)} | Novelty: ${novelty.toFixed(2)}`;
      document.getElementById('pVal').innerText = profit.toFixed(2);
      document.getElementById('lVal').innerText = love.toFixed(2);
      document.getElementById('tVal').innerText = tax.toFixed(2);
      const scoreEl = document.getElementById('pltScore');
      scoreEl.innerText = (netScore >= 0 ? '+' : '') + netScore.toFixed(2);
      scoreEl.className = netScore >= 0 ? 'plt-profit' : 'plt-tax';

      history.push({ t, profit, love, tax });
      if (history.length > 100) history.shift();

      renderCanvas();
      requestAnimationFrame(updateTelemetry);
    }

    function renderCanvas() {
      eCtx.clearRect(0, 0, emotionCanvas.width, emotionCanvas.height);
      pCtx.clearRect(0, 0, pltCanvas.width, pltCanvas.height);
      // Render PLT lines
      pCtx.beginPath();
      pCtx.strokeStyle = '#4ade80';
      history.forEach((h, i) => {
        const x = (i / 100) * pltCanvas.width;
        const y = pltCanvas.height - (h.profit * pltCanvas.height);
        if (i === 0) pCtx.moveTo(x, y); else pCtx.lineTo(x, y);
      });
      pCtx.stroke();
    }
    window.onload = updateTelemetry;
  </script>
</body>
</html>
