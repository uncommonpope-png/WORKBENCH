<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PLT Temporal Memory Dashboard</title>
<style>
body { background: #0b0d13; color: #e2e8f0; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
.card { background: #1a1d27; border: 1px solid #2d3748; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
canvas { width: 100%; height: 260px; background: #0f111a; border-radius: 6px; display: block; }
.badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
.badge-profit { background: #166534; color: #4ade80; }
.badge-love { background: #831843; color: #f472b6; }
.badge-tax { background: #7f1d1d; color: #f87171; }
</style>
</head>
<body>
<h1>PLT Temporal Memory Dashboard</h1>
<p>Real-Time Value Synthesis & Creature vs. State Consciousness Tracking</p>
<div class="grid">
  <div class="card">
    <h3>Creature Substrate Engine (Macro)</h3>
    <div id="creature-status">Valence: <span id="val-val">0.35</span> | Homeostasis: <span id="hom-val">Stable</span></div>
  </div>
  <div class="card">
    <h3>State Ignition Runtime (Micro)</h3>
    <div id="state-status">Ignition Threshold: <span>0.75</span> | Broadcast: <span id="ign-val">Idle</span></div>
  </div>
</div>
<div class="card">
  <h3>Temporal Memory Synthesis & PLT Value Flow</h3>
  <canvas id="pltCanvas"></canvas>
</div>
<script>
const canvas = document.getElementById('pltCanvas');
const ctx = canvas ? canvas.getContext('2d') : null;
let history = [];
function init() {
  for(let i=0; i<40; i++) {
    const p = 12 + Math.sin(i * 0.2) * 5 + Math.random() * 2;
    const l = 10 + Math.cos(i * 0.2) * 4 + Math.random() * 2;
    const t = 3 + Math.random() * 2;
    history.push({ t: i, profit: p, love: l, tax: t, value: p + l - t });
  }
}
function render() {
  if(!ctx || !canvas) return;
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = 2;
  // Draw Value Synthesis curve
  ctx.strokeStyle = '#38bdf8';
  ctx.beginPath();
  history.forEach((pt, idx) => {
    const x = (idx / (history.length - 1)) * canvas.width;
    const y = canvas.height - (pt.value * 8);
    if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}
init();
window.addEventListener('resize', render);
render();
</script>
</body>
</html>
