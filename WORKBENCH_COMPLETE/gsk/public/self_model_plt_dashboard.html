<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Self-Model & Sovereign PLT Dashboard</title>
<style>body { margin: 0; overflow: hidden; background: #050508; color: #fff; font-family: monospace; } #overlay { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(5,5,12,0.85); padding: 18px; border-radius: 8px; border: 1px solid #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.3); } .metric { margin-bottom: 8px; font-size: 14px; }</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="overlay">
<h2 style="margin-top:0;color:#00ffcc;">Sovereign PLT & Self-Model</h2>
<div class="metric" id="plt-metrics">Profit: <span style="color:#00ff88;">0.90</span> | Love: <span style="color:#ff66cc;">0.85</span> | Tax: <span style="color:#ff4444;">0.10</span></div>
<div class="metric" id="emergence-idx">Self-Model Emergence: <span style="color:#00e5ff;">0.94</span></div>
</div>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const count = 4000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(count * 3);
const colors = new Float32Array(count * 3);
for(let i=0; i<count*3; i+=3) {
  positions[i] = (Math.random() - 0.5) * 25;
  positions[i+1] = (Math.random() - 0.5) * 25;
  positions[i+2] = (Math.random() - 0.5) * 25;
  colors[i] = 0.0; colors[i+1] = 0.9; colors[i+2] = 0.8;
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const material = new THREE.PointsMaterial({ size: 0.07, vertexColors: true, transparent: true, opacity: 0.85 });
const particles = new THREE.Points(geometry, material);
scene.add(particles);
camera.position.z = 18;

function animate() {
  requestAnimationFrame(animate);
  particles.rotation.x += 0.0015;
  particles.rotation.y += 0.0025;
  renderer.render(scene, camera);
}
animate();

</script>
</body>
</html>
