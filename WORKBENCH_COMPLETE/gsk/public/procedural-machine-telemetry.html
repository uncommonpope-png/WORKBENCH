<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Procedural Machine Telemetry Visualizer</title>
<style>
body { margin: 0; background: #05070a; color: #00ffcc; font-family: monospace; overflow: hidden; }
#canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
.glass-panel { position: absolute; z-index: 2; background: rgba(10, 15, 25, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 8px; padding: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
#hud { top: 20px; left: 20px; width: 320px; }
#inspector { top: 20px; right: 20px; width: 360px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud" class="glass-panel">
  <h2>SYSTEM TELEMETRY</h2>
  <div id="metrics-stream">Initializing stream...</div>
</div>
<div id="inspector" class="glass-panel">
  <h2>STATE INSPECTION</h2>
  <div id="state-details">Awaiting core pulse...</div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();
let time = 0;
function drawGrid() {
  ctx.fillStyle = 'rgba(5, 7, 10, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(0, 255, 204, 0.15)';
  ctx.lineWidth = 1;
  const step = 40;
  for (let x = 0; x < canvas.width; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
  time += 0.05;
  const cx = canvas.width / 2, cy = canvas.height / 2;
  ctx.strokeStyle = '#00ffcc';
  ctx.beginPath();
  ctx.arc(cx, cy, 100 + Math.sin(time) * 20, 0, Math.PI * 2);
  ctx.stroke();
  requestAnimationFrame(drawGrid);
}
drawGrid();
function updateMetrics() {
  const p = (0.7 + Math.sin(time*0.5)*0.2).toFixed(3);
  const l = (0.8 + Math.cos(time*0.3)*0.15).toFixed(3);
  const t = (0.05 + Math.sin(time*0.8)*0.02).toFixed(3);
  document.getElementById('metrics-stream').innerHTML = `PROFIT: ${p}<br>LOVE: ${l}<br>TAX: ${t}`;
  document.getElementById('state-details').innerHTML = `STATE: OPERATIONAL<br>CYCLE: ${Math.floor(time * 10)}<br>MODE: PROPORTIONAL_OPTIMAL`;
}
setInterval(updateMetrics, 100);
</script>
</body>
</html>
