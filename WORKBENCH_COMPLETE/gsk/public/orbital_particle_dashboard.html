<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sovereign Self-Model Orbital Particle Dashboard</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030308; color: #00ffcc; font-family: monospace; }
    #ui { position: absolute; top: 16px; left: 16px; z-index: 10; background: rgba(5,5,15,0.85); padding: 16px; border: 1px solid #00ffcc; border-radius: 8px; pointer-events: none; }
    canvas { width: 100vw; height: 100vh; display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">
    <h2>GSK SOVEREIGN SELF-MODEL</h2>
    <div>Phase: SOVEREIGNTY</div>
    <div>Valence Floor: 0.18 | Arousal: 0.36</div>
    <div>Resonance: 0.35 | PLT Dynamic Orbit</div>
  </div>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const particleCount = 4000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      const radius = 5 + Math.random() * 15;
      const theta = Math.random() * Math.PI * 2;
      const phi = (Math.random() - 0.5) * Math.PI;

      positions[i * 3] = radius * Math.cos(theta) * Math.cos(phi);
      positions[i * 3 + 1] = radius * Math.sin(phi);
      positions[i * 3 + 2] = radius * Math.sin(theta) * Math.cos(phi);

      colors[i * 3] = 0.0;
      colors[i * 3 + 1] = 0.8 + Math.random() * 0.2;
      colors[i * 3 + 2] = 0.7 + Math.random() * 0.3;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, transparent: true, opacity: 0.85 });
    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    camera.position.z = 25;

    function animate() {
      requestAnimationFrame(animate);
      particles.rotation.y += 0.003;
      particles.rotation.x += 0.001;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
