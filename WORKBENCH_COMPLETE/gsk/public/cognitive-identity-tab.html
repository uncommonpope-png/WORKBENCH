<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cognitive Self-Model &amp; Identity Telemetry</title>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: monospace; padding: 20px; }
    .telemetry-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .metric-title { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; }
    .metric-value { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>
  <div id="app">
    <h2>Cognitive Self-Model &amp; Real-Time Telemetry</h2>
    <div class="telemetry-card">
      <div class="metric-title">Agent Identity</div>
      <div class="metric-value" id="agent-identity">GSK - Grand Code Pope Companion</div>
    </div>
    <div class="telemetry-card">
      <div class="metric-title">Cognitive Valence &amp; Arousal</div>
      <div class="metric-value" id="cognitive-state">Valence: 0.50 | Arousal: 0.30</div>
    </div>
  </div>
</body>
</html>
