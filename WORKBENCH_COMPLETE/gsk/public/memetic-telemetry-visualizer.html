<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memetic Propagation Telemetry Visualizer</title>
<style>
body { background: #0b0f19; color: #e2e8f0; font-family: monospace; margin: 0; padding: 20px; }
.grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
.card { background: #131b2e; border: 1fr solid #1e293b; border-radius: 8px; padding: 16px; }
canvas { width: 100%; height: 350px; background: #080c14; border-radius: 4px; }
.metric { margin-bottom: 12px; }
label { display: block; font-size: 0.8rem; color: #94a3b8; }
.val { font-size: 1.4rem; font-weight: bold; color: #38bdf8; }
</style>
</head>
<body>
<h1>Memetic Propagation Telemetry Visualizer</h1>
<div class="grid">
  <div class="card">
    <h2>Live Telemetry Stream (Memetic Propagation vs PLT)</h2>
    <canvas id="chartCanvas"></canvas>
  </div>
  <div class="card">
    <h2>PLT Value Metrics</h2>
    <div class="metric"><label>VIRAL REACH (Profit)</label><div id="profitVal" class="val">0.00</div></div>
    <div class="metric"><label>RESONANCE & BONDS (Love)</label><div id="loveVal" class="val">0.00</div></div>
    <div class="metric"><label>ATTENTION DECAY (Tax)</label><div id="taxVal" class="val">0.00</div></div>
    <div class="metric"><label>NET PLT TRUE VALUE</label><div id="pltVal" class="val" style="color:#4ade80;">0.00</div></div>
    <hr style="border-color:#1e293b;">
    <button onclick="toggleSim()" style="width:100%; padding:10px; background:#2563eb; color:#fff; border:none; border-radius:4px; cursor:pointer;">Toggle Realtime Stream</button>
  </div>
</div>
<script>
const canvas = document.getElementById('chartCanvas');
const ctx = canvas.getContext('2d');
canvas.width = canvas.clientWidth;
canvas.height = canvas.clientHeight;

let running = true;
let history = [];
const maxPoints = 60;

function calculatePLT(virality, resonance, decay) {
  const profit = virality * 1.5;
  const love = resonance * 1.2;
  const tax = decay * 0.8;
  const netPLT = profit + love - tax;
  return { profit, love, tax, netPLT };
}

function stepTelemetry() {
  const t = Date.now() / 1000;
  const virality = Math.abs(Math.sin(t * 0.5) * 50 + Math.random() * 10);
  const resonance = Math.abs(Math.cos(t * 0.3) * 40 + Math.random() * 15);
  const decay = Math.abs(Math.sin(t * 0.8) * 20 + Math.random() * 5);
  const metrics = calculatePLT(virality, resonance, decay);
  
  history.push(metrics);
  if (history.length > maxPoints) history.shift();
  
  document.getElementById('profitVal').innerText = metrics.profit.toFixed(2);
  document.getElementById('loveVal').innerText = metrics.love.toFixed(2);
  document.getElementById('taxVal').innerText = metrics.tax.toFixed(2);
  document.getElementById('pltVal').innerText = metrics.netPLT.toFixed(2);
  
  renderChart();
}

function renderChart() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (history.length < 2) return;
  
  const w = canvas.width / (maxPoints - 1);
  const h = canvas.height;
  
  // Draw Net PLT curve
  ctx.beginPath();
  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 3;
  history.forEach((pt, i) => {
    const x = i * w;
    const y = h - (pt.netPLT / 150) * h;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function toggleSim() { running = !running; }
setInterval(() => { if (running) stepTelemetry(); }, 500);
</script>
</body>
</html>
