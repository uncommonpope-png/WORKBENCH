<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unified PLT Yield & Community Dashboard</title>
  <style>
    body { background: #0a0a10; color: #e0e0e0; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card { background: #141420; border: 1px solid #2a2a40; border-radius: 8px; padding: 20px; }
    .metric { font-size: 2em; color: #00ffcc; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Unified PLT Dashboard</h1>
  <div class="grid">
    <div class="card"><h2>High-Margin Yield</h2><div class="metric" id="yield-val">+94.2%</div></div>
    <div class="card"><h2>Community Value</h2><div class="metric" id="community-val">98.6 / 100</div></div>
    <div class="card"><h2>Cognitive Precision Gain</h2><div class="metric" id="precision-val">0.85</div></div>
  </div>
</body>
</html>
