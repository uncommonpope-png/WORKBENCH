<!DOCTYPE html><html><head><title>Soul Note Telemetry Visualizer</title><style>body{background:#0a0a10;color:#e0e0e0;font-family:sans-serif;margin:0;padding:20px;}canvas{background:#12121c;border:1px solid #333;display:block;margin:10px 0;}.controls{display:flex;gap:10px;margin-bottom:15px;}select,input{background:#1e1e2e;color:#fff;border:1px solid #444;padding:8px;border-radius:4px;}</style></head><body><h1>Soul-Note Telemetry Visualizer</h1><div class="controls"><label>Filter Node: <select id="nodeFilter"><option value="all">All Nodes</option><option value="Profit Prime">Profit Prime</option><option value="Love Weaver">Love Weaver</option><option value="Tax Collector">Tax Collector</option><option value="Harvester">Harvester</option></select></label><label>Min Frequency (Hz): <input type="number" id="freqFilter" value="10" min="1" max="100"></label></div><canvas id="telemetryCanvas" width="800" height="400"></canvas><script>console.log('Visualizer initialized');</script></body></html><script>const canvas=document.getElementById('telemetryCanvas');const ctx=canvas.getContext('2d');let notes=[];function addSoulNote(node,pltVal,freq){notes.push({node,pltVal,freq,ts:Date.now()});if(notes.length>200)notes.shift();}setInterval(()=>{const nodes=['Profit Prime','Love Weaver','Tax Collector','Harvester'];const n=nodes[Math.floor(Math.random()*nodes.length)];addSoulNote(n,Math.random(),Math.floor(Math.random()*50)+1);render();},100);function render(){ctx.clearRect(0,0,canvas.width,canvas.height);const filterNode=document.getElementById('nodeFilter').value;const minFreq=parseInt(document.getElementById('freqFilter').value)||0;ctx.strokeStyle='#00ffcc';ctx.beginPath();let x=0;notes.filter(n=>(filterNode==='all'||n.node===filterNode)&&n.freq>=minFreq).forEach((n,i)=>{const y=canvas.height-(n.pltVal*canvas.height);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);x+=4;});ctx.stroke();}</script>
