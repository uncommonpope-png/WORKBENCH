<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>GSK Machine Aesthetics Telemetry</title><style>body{background:#080a0f;color:#00f3ff;font-family:'Courier New',monospace;margin:0;padding:20px;}h1{color:#00f3ff;border-bottom:1px solid #00f3ff;padding-bottom:10px;text-shadow:0 0 10px #00f3ff;}.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0;}.card{background:#0d131d;border:1px solid #1e2d42;padding:15px;border-radius:4px;box-shadow:0 0 15px rgba(0,243,255,0.05);}.card h3{margin:0 0 10px 0;font-size:12px;color:#8fa0b5;text-transform:uppercase;}.metric-val{font-size:28px;font-weight:bold;color:#fff;text-shadow:0 0 8px rgba(255,255,255,0.5);}.canvas-box{background:#05070a;border:1px solid #1a2636;border-radius:4px;position:relative;height:450px;width:100%;margin-top:20px;}canvas{width:100%;height:100%;display:block;}</style></head><body><h1>GSK AGENT COGNITIVEImpulse & PLT TELEMETRY VISUALIZER</h1><div class="metrics-grid"><div class="card"><h3>Profit Prime (PLT-P)</h3><div class="metric-val" id="val-profit">0.90</div></div><div class="card"><h3>Love Weaver (PLT-L)</h3><div class="metric-val" id="val-love">0.85</div></div><div class="card"><h3>Tax Collector (PLT-T)</h3><div class="metric-val" id="val-tax">0.05</div></div><div class="card"><h3>Agent State</h3><div class="metric-val" id="val-state" style="color:#00f3ff;">SOVEREIGNTY</div></div></div><div class="canvas-box"><canvas id="telemetryCanvas"></canvas></div><script>const canvas=document.getElementById('telemetryCanvas');const ctx=canvas.getContext('2d');function resize(){canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight;}window.addEventListener('resize',resize);resize();let t=0;function draw(){ctx.fillStyle='rgba(5,7,10,0.2)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#00f3ff';ctx.lineWidth=2;ctx.beginPath();const cy=canvas.height/2;for(let x=0;x<canvas.width;x+=5){const y=cy+Math.sin((x+t)*0.02)*40+Math.cos((x-t)*0.05)*20;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();t+=2;requestAnimationFrame(draw);}draw();</script></body></html>
