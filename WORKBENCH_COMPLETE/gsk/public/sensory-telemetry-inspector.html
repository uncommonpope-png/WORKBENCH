<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSK - Synthetic Sensory Modality Inspector</title>
  <style>
    body { background: #0a0d14; color: #e2e8f0; font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    h1 { color: #38bdf8; font-size: 1.5rem; margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .channel-box { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 8px; padding: 16px; }
    .channel-title { color: #a7f3d0; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; }
    .metric { font-size: 1.2rem; font-weight: 600; margin: 8px 0; color: #f43f5e; }
  </style>
</head>
<body>
  <div class="glass-card">
    <h1>GSK Synthetic Sensory Modality Telemetry</h1>
    <p>Real-time agent state inspection stream across synthetic sensory channels.</p>
  </div>
  <div class="grid" id="channelsContainer">
    <div class="channel-box"><div class="channel-title">Visual Stream</div><div class="metric">60 FPS | Nominal</div></div>
    <div class="channel-box"><div class="channel-title">Auditory Telemetry</div><div class="metric">44.1 kHz | Active</div></div>
    <div class="channel-box"><div class="channel-title">Proprioceptive Vector</div><div class="metric">0.98 Coherence</div></div>
    <div class="channel-box"><div class="channel-title">Cognitive Entropy</div><div class="metric">0.12 Optimal</div></div>
  </div>
</body>
</html>
