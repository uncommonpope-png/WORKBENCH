<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enactive Telemetry Visualizer</title>
<style>
body { margin: 0; background: #0a0d14; color: #e2e8f0; font-family: system-ui, sans-serif; overflow: hidden; }
.glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div id="app" style="display:flex; height:100vh;">
  <div style="flex:1; position:relative;">
    <canvas id="envCanvas"></canvas>
  </div>
  <div class="glass-panel" style="width:360px; margin:16px; display:flex; flex-direction:column; gap:16px;">
    <h2>Enactive Telemetry Visualizer</h2>
    <div id="telemetryStats"></div>
    <div id="pltMetrics"></div>
  </div>
</div>
<script>
// Telemetry Visualizer Initial Scaffold
const canvas = document.getElementById('envCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
window.addEventListener('resize', resize); resize();

const agent = { x: canvas.width/2, y: canvas.height/2, vx: 0, vy: 0, energy: 100, perceptionRadius: 120, state: 'perceiving' };
const environment = { grid: [], particles: [], perturbation: 0 };

for(let i=0; i<40; i++) {
  environment.particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, charge: (Math.random()-0.5)*2, radius: 4 + Math.random()*6 });
}
function step() {
  environment.particles.forEach(p => {
    const dx = agent.x - p.x;
    const dy = agent.y - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < agent.perceptionRadius) {
      p.x -= (dx/dist) * 1.5;
      p.y -= (dy/dist) * 1.5;
      agent.energy = Math.min(100, Math.max(0, agent.energy + p.charge * 0.1));
    }
  });
  render();
  requestAnimationFrame(step);
}
function render() {
  ctx.fillStyle = 'rgba(10, 13, 20, 0.3)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
  ctx.beginPath(); ctx.arc(agent.x, agent.y, agent.perceptionRadius, 0, Math.PI*2); ctx.stroke();
  environment.particles.forEach(p => {
    ctx.fillStyle = p.charge > 0 ? '#10b981' : '#f43f5e';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
  });
  document.getElementById('telemetryStats').innerText = `Agent Energy: ${agent.energy.toFixed(1)} | Active Particles: ${environment.particles.length}`;
  document.getElementById('pltMetrics').innerText = `PLT Value Coupling: ${(agent.energy/100 * 0.9).toFixed(2)}`;
}
step();
</script>
</body>
</html>
