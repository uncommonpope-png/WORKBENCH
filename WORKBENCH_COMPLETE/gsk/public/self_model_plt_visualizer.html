<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Self-Model Agent State & PLT Visualizer</title>
<style>
body { background: #0a0a10; color: #e0e0e0; font-family: monospace; margin: 0; padding: 20px; }
.card { background: #12121e; border: 1px solid #2a2a40; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
canvas { width: 100%; height: 260px; background: #05050a; border-radius: 4px; }
button { background: #00ffaa; color: #000; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
button:hover { background: #00cc88; }
</style>
</head>
<body>
<h1>⚡ Self-Model Agent State & PLT Visualizer</h1>
<div class="grid">
<div class="card"><h2>Agent State Telemetry</h2><canvas id="stateCanvas"></canvas><div id="stateLog"></div></div>
<div class="card"><h2>PLT Value Optimizer</h2><canvas id="pltCanvas"></canvas><div id="pltStats"></div></div>
</div>
<script>
const stateCtx = document.getElementById('stateCanvas').getContext('2d');
const pltCtx = document.getElementById('pltCanvas').getContext('2d');
let history = [];
function initVisualizer() {
  for(let i=0; i<30; i++) {
    history.push({
      profit: 0.5 + Math.random()*0.4,
      love: 0.4 + Math.random()*0.5,
      tax: 0.1 + Math.random()*0.2,
      valence: Math.sin(i/3)*0.5 + 0.5
    });
  }
  render();
}
function render() {
  stateCtx.clearRect(0,0,300,150);
  pltCtx.clearRect(0,0,300,150);
  history.forEach((h, idx) => {
    let x = idx * 10;
    stateCtx.fillStyle='#00ffaa';
    stateCtx.fillRect(x, 150 - h.valence*100, 8, h.valence*100);
    pltCtx.fillStyle='#ff0077';
    pltCtx.fillRect(x, 150 - (h.profit + h.love - h.tax)*50, 8, (h.profit + h.love - h.tax)*50);
  });
}
initVisualizer();
</script>
</body>
</html>
