<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machine Telemetry Dashboard - Live Agent State</title>
<style>
  :root { --bg: #07090e; --panel-bg: rgba(15, 23, 42, 0.75); --neon: #00ffcc; --accent: #7928ca; --text: #e2e8f0; }
  body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace, sans-serif; margin: 0; padding: 24px; }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,255,204,0.2); padding-bottom: 16px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .glass-panel { background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid rgba(0, 255, 204, 0.25); border-radius: 12px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
  .badge { background: rgba(0, 255, 204, 0.15); color: var(--neon); padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; border: 1px solid var(--neon); }
  pre { background: #0d1117; padding: 12px; border-radius: 6px; overflow-x: auto; color: #a5d6ff; }
  canvas { width: 100%; height: 220px; border-radius: 6px; background: #030712; }
</style>
</head>
<body>
<div class="header">
  <h1>MACHINE TELEMETRY <span class="badge">LIVE INSPECTOR</span></h1>
  <div>PLT Core System State: <strong>SOVEREIGN</strong></div>
</div>
<div class="grid">
  <div class="glass-panel">
    <h2>Agent Telemetry Pulse</h2>
    <canvas id="telemetryCanvas" width="500" height="220"></canvas>
  </div>
  <div class="glass-panel">
    <h2>Live State Inspector</h2>
    <pre id="stateDisplay">{
  "agent": "GSK-Prime",
  "status": "SOVEREIGN",
  "PLT": { "profit": 1.05, "love": 0.85, "tax": 0.05 },
  "hz": 60
}</pre>
  </div>
</div>
<script>
const canvas = document.getElementById('telemetryCanvas');
const ctx = canvas.getContext('2d');
let tick = 0;
function render() {
  ctx.fillStyle = 'rgba(3, 7, 18, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#00ffcc';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x < canvas.width; x += 5) {
    const y = 110 + Math.sin((x + tick) * 0.05) * 35 + Math.cos((x + tick * 1.5) * 0.02) * 15;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  tick += 2;
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
