<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unified Agent State Inspection</title>
<style>body{font-family:sans-serif;background:#0d1117;color:#c9d1d9;padding:20px;}</style>
</head>
<body>
<div id="app"><h1>Unified Agent State Inspection</h1><div id="telemetry-view">Initializing synchronization bridge...</div></div>
<script>
const telemetryState = { profit: 0.9, love: 0.05, tax: 0.05, status: 'SOVEREIGN' };
function render() {
  document.getElementById('telemetry-view').innerHTML = `<p><strong>Profit:</strong> ${telemetryState.profit}</p><p><strong>Love:</strong> ${telemetryState.love}</p><p><strong>Tax:</strong> ${telemetryState.tax}</p><p><strong>Status:</strong> ${telemetryState.status}</p>`;
}
render();
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'PLT_STATE_UPDATE') {
    Object.assign(telemetryState, event.data.payload);
    render();
  }
});
</script>
</body>
</html>
