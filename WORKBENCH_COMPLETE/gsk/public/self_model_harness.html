<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js Canvas Component & Self-Model Harness</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  body { margin: 0; background: #0a0a0c; color: #e0e0e0; font-family: monospace; overflow: hidden; }
  #canvas-container { width: 100vw; height: 100vh; display: block; }
  #overlay { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); padding: 16px; border: 1px solid #333; border-radius: 8px; }
</style>
</head>
<body>
<div id="overlay">
  <h3>Self-Model Evaluation Harness</h3>
  <div id="metrics">Valence: 0.35 | Mood: neutral</div>
</div>
<div id="canvas-container"></div>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0c);
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 3;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('canvas-container').appendChild(renderer.domElement);
  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const material = new THREE.MeshStandardMaterial({ color: 0xff3344, roughness: 0.3 });
  const cube = new THREE.Mesh(geometry, material);
  scene.add(cube);
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(2, 4, 5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));
  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
