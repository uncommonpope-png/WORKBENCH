<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sovereign PLT & Self-Model Emergence Particle Dashboard</title>
<style>
body { margin: 0; overflow: hidden; background: #05050a; color: #e0e0e0; font-family: 'Courier New', monospace; }
#canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
.hud { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(5, 5, 12, 0.85); padding: 18px; border: 1px solid #00ffcc; border-radius: 8px; box-shadow: 0 0 20px rgba(0,255,204,0.25); width: 340px; pointer-events: none; }
h1 { font-size: 14px; margin: 0 0 12px 0; color: #00ffcc; text-transform: uppercase; letter-spacing: 1.5px; }
.metric-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 12px; }
.val { font-weight: bold; }
.profit { color: #00ff88; }
.love { color: #ff33aa; }
.tax { color: #ff5533; }
.selfmodel { color: #00ccff; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<div class="hud">
<h1>Sovereign PLT Self-Model</h1>
<div class="metric-row"><span>Profit Flow:</span><span id="m-profit" class="val profit">0.00</span></div>
<div class="metric-row"><span>Love Affinity:</span><span id="m-love" class="val love">0.00</span></div>
<div class="metric-row"><span>Tax Friction:</span><span id="m-tax" class="val tax">0.00</span></div>
<div class="metric-row"><span>Valence Floor:</span><span id="m-valence" class="val selfmodel">0.00</span></div>
<div class="metric-row"><span>RSMCL Entropy:</span><span id="m-entropy" class="val selfmodel">0.00</span></div>
<div class="metric-row"><span>Identity State:</span><span id="m-identity" class="val selfmodel">INITIALIZING</span></div>
</div>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 60;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('canvas-container').appendChild(renderer.domElement);

const particleCount = 8000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 100;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 100;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
  colors[i * 3] = 0.0;
  colors[i * 3 + 1] = 0.8;
  colors[i * 3 + 2] = 1.0;
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const material = new THREE.PointsMaterial({ size: 1.2, vertexColors: true, transparent: true, opacity: 0.8 });
const particleSystem = new THREE.Points(geometry, material);
scene.add(particleSystem);
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.015;
  particleSystem.rotation.y = time * 0.1;
  particleSystem.rotation.x = Math.sin(time * 0.05) * 0.15;
  
  const profit = (Math.sin(time) * 0.5 + 0.5).toFixed(2);
  const love = (Math.cos(time * 0.7) * 0.5 + 0.5).toFixed(2);
  const tax = (Math.sin(time * 1.3) * 0.2 + 0.08).toFixed(2);
  const valence = Math.max(0.0, Math.sin(time * 0.4) * 0.5 + 0.1).toFixed(2);
  const entropy = (0.15 + Math.sin(time * 2.1) * 0.1).toFixed(3);
  
  document.getElementById('m-profit').innerText = profit;
  document.getElementById('m-love').innerText = love;
  document.getElementById('m-tax').innerText = tax;
  document.getElementById('m-valence').innerText = valence;
  document.getElementById('m-entropy').innerText = entropy;
  document.getElementById('m-identity').innerText = valence > 0.09 ? 'NON-LINEAR EVOLUTION' : 'PERSISTENT SELF';
  
  renderer.render(scene, camera);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
animate();
</script>
</body>
</html>
