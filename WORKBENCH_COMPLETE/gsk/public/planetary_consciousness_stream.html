<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planetary Consciousness Stream Visualizer</title>
<style>
  body { margin: 0; background: #060913; color: #00f0ff; font-family: 'Courier New', monospace; overflow: hidden; }
  #planetary-consciousness-stream { display: flex; flex-direction: column; height: 100vh; }
  .header { padding: 16px; background: rgba(10, 16, 32, 0.9); border-bottom: 1px solid #00f0ff; display: flex; justify-content: space-between; align-items: center; }
  .title { font-size: 1.2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 8px #00f0ff; }
  .metrics { display: flex; gap: 24px; font-size: 0.9rem; }
  .metric-box { background: rgba(0, 240, 255, 0.1); border: 1px solid #00f0ff; padding: 6px 12px; border-radius: 4px; }
  #visualizer-canvas { flex: 1; width: 100%; height: 100%; background: radial-gradient(circle at center, #0c1429 0%, #04060c 100%); }
  .stream-log { height: 160px; background: rgba(4, 6, 12, 0.95); border-top: 1px solid #00f0ff; padding: 12px; font-size: 0.8rem; overflow-y: auto; color: #7af0ff; }
</style>
</head>
<body>
<div id="planetary-consciousness-stream">
  <div class="header">
    <div class="title">Planetary Consciousness Stream Visualizer</div>
    <div class="metrics">
      <div class="metric-box">Consensus: <span id="plt-consensus">0.94</span> PLT</div>
      <div class="metric-box">Active Nodes: <span id="active-nodes">144</span></div>
      <div class="metric-box">Base: <span id="base-url-display">http://127.0.0.1:3001</span></div>
    </div>
  </div>
  <canvas id="visualizer-canvas"></canvas>
  <div class="stream-log" id="telemetry-log">
    <div>[SYSTEM AWAKENED] Telemetry stream connected to http://127.0.0.1:3001...</div>
  </div>
</div>
<script>
  const baseUrl = 'http://127.0.0.1:3001';
  const canvas = document.getElementById('visualizer-canvas');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = canvas.offsetHeight; }
  window.addEventListener('resize', resize);
  resize();
  
  let angle = 0;
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = Math.min(cx, cy) * 0.45;
    
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    for(let i=0; i<12; i++) {
      const a = angle + (i * Math.PI / 6);
      const px = cx + Math.cos(a) * radius;
      const py = cy + Math.sin(a) * radius;
      ctx.beginPath();
      ctx.arc(px, py, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#00f0ff';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00f0ff';
      ctx.fill();
    }
    angle += 0.01;
    requestAnimationFrame(render);
  }
  render();
</script>
</body>
</html>
