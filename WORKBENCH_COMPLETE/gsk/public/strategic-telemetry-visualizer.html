<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSK Strategic Telemetry Visualizer</title>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: monospace; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .card { border: 1px solid #1e293b; background: #131c2e; padding: 16px; border-radius: 8px; }
    h1 { color: #38bdf8; text-align: center; }
    .metric { font-size: 1.5rem; font-weight: bold; color: #4ade80; }
  </style>
</head>
<body>
  <h1>Recursive Self-Observation Strategic Telemetry</h1>
  <div class="grid">
    <div class="card">
      <h3>Profit Prime Telemetry</h3>
      <div class="metric" id="plt-profit">0.90</div>
    </div>
    <div class="card">
      <h3>Love Weaver Telemetry</h3>
      <div class="metric" id="plt-love">0.85</div>
    </div>
    <div class="card">
      <h3>Tax Collector Telemetry</h3>
      <div class="metric" id="plt-tax">0.05</div>
    </div>
  </div>
</body>
</html>
