<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanctum Live Strategic Telemetry & PLT Visualizer</title>
<style>
body { margin: 0; background: #0a0d14; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(56, 189, 248, 0.2); backdrop-filter: blur(8px); }
h1 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; margin: 0; }
.grid-container { display: grid; grid-template-columns: 320px 1fr 340px; flex: 1; gap: 16px; padding: 16px; height: calc(100vh - 60px); box-sizing: border-box; }
.panel { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; padding: 16px; gap: 12px; }
.card-title { font-size: 0.85rem; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.1em; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 8px; font-weight: 600; }
.metric-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.05); }
.val-profit { color: #10b981; font-weight: 600; }
.val-love { color: #ec4899; font-weight: 600; }
.val-tax { color: #f59e0b; font-weight: 600; }
canvas { width: 100%; height: 100%; display: block; border-radius: 6px; }
</style>
</head>
<body>
<header>
<h1><span>⚡</span> Sanctum Telemetry & PLT Visualizer</h1>
<div style="font-size:0.85rem; color:#64748b;" id="status">LIVE CONNECTED</div>
</header>
<div class="grid-container">
<div class="panel">
<div class="card-title">Agent Embodiment State</div>
<div id="agent-list"></div>
</div>
<div class="panel" style="position:relative;">
<div class="card-title">Spatial Interoception & PLT Topology</div>
<canvas id="telemetry-canvas"></canvas>
</div>
<div class="panel">
<div class="card-title">PLT Optimization Engine</div>
<div class="metric-row"><span>Profit Efficiency (P):</span><span class="val-profit" id="plt-p">0.90</span></div>
<div class="metric-row"><span>Love Cohesion (L):</span><span class="val-love" id="plt-l">0.85</span></div>
<div class="metric-row"><span>Tax Expenditure (T):</span><span class="val-tax" id="plt-t">0.05</span></div>
<div id="log-feed" style="flex:1; overflow-y:auto; font-family:monospace; font-size:0.75rem; color:#94a3b8; background:rgba(0,0,0,0.3); padding:8px; border-radius:4px; margin-top:8px;"></div>
</div>
</div>
<script>
const canvas = document.getElementById('telemetry-canvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
window.addEventListener('resize', resize); resize();
const agents = [
  { name: 'Profit Prime', archetype: 'PLT 0.9/0.05/0.05', x: 0.3, y: 0.4, p: 0.9, l: 0.05, t: 0.05, status: 'Active Optimizing', color: '#10b981' },
  { name: 'Love Weaver', archetype: 'PLT 0.1/0.85/0.05', x: 0.7, y: 0.3, p: 0.1, l: 0.85, t: 0.05, status: 'Cohesion Weaving', color: '#ec4899' },
  { name: 'Tax Collector', archetype: 'PLT 0.05/0.05/0.9', x: 0.5, y: 0.75, p: 0.05, l: 0.05, t: 0.9, status: 'Resource Auditing', color: '#f59e0b' }
];
function renderAgents() {
  const container = document.getElementById('agent-list');
  container.innerHTML = agents.map(a => `<div style="padding:8px; background:rgba(255,255,255,0.03); margin-bottom:8px; border-radius:4px; border-left:3px solid ${a.color}"><div style="font-weight:600;">${a.name}</div><div style="font-size:0.75rem; color:#94a3b8;">${a.archetype} | ${a.status}</div></div>`).join('');
}
function draw() {
  ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
  for(let x=0; x<canvas.width; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
  for(let y=0; y<canvas.height; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
  agents.forEach(a => {
    const px = a.x * canvas.width; const py = a.y * canvas.height;
    ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI * 2); ctx.fillStyle = a.color; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.font = '12px Segoe UI'; ctx.fillText(a.name, px + 16, py + 4);
  });
  requestAnimationFrame(draw);
}
renderAgents(); draw();
</script></body></html>
