<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Embodied Agent State Inspector - Spatial Physics to PLT Telemetry</title>
<style>
  body { margin: 0; overflow: hidden; background: #080a0f; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; }
  #hud { position: absolute; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); padding: 18px; border: 1px solid rgba(51, 65, 85, 0.6); border-radius: 12px; min-width: 280px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  h2 { margin: 0 0 12px 0; font-size: 16px; color: #38bdf8; font-weight: 600; letter-spacing: 0.5px; }
  .metric { display: flex; justify-content: space-between; margin: 6px 0; font-size: 13px; }
  .value { font-weight: bold; font-family: monospace; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<div id="hud">
  <h2>3D Embodied PLT Inspector</h2>
  <div id="metrics">
    <div class="metric"><span>Profit Velocity (Angular):</span><span id="m-profit" class="value">0.90</span></div>
    <div class="metric"><span>Love Cohesion (Attraction):</span><span id="m-love" class="value">0.85</span></div>
    <div class="metric"><span>Tax Drag (Friction):</span><span id="m-tax" class="value">0.15</span></div>
    <hr style="border-color: rgba(51,65,85,0.4); margin: 10px 0;">
    <div class="metric"><span style="color:#4ade80;">True Value (PLT):</span><span id="m-tv" class="value" style="color:#4ade80;">1.60</span></div>
  </div>
</div>
<script>
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080a0f, 0.03);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 7);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const grid = new THREE.GridHelper(20, 20, 0x1e293b, 0x0f172a);
grid.position.y = -1.5;
scene.add(grid);

const coreGeo = new THREE.IcosahedronGeometry(1, 3);
const coreMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, wireframe: true, roughness: 0.2, metalness: 0.8 });
const agentMesh = new THREE.Mesh(coreGeo, coreMat);
scene.add(agentMesh);

const light = new THREE.PointLight(0x38bdf8, 2, 20);
light.position.set(5, 5, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x0f172a, 1.5));

let pltTelemetry = { profit: 0.95, love: 0.85, tax: 0.15 };

function animate() {
  requestAnimationFrame(animate);
  const tv = pltTelemetry.profit + pltTelemetry.love - pltTelemetry.tax;
  agentMesh.rotation.y += 0.005 * (1 + pltTelemetry.profit);
  agentMesh.rotation.x += 0.003 * (1 + pltTelemetry.tax);
  const scale = 1 + 0.15 * Math.sin(Date.now() * 0.002 * (1 + pltTelemetry.love));
  agentMesh.scale.set(scale, scale, scale);
  document.getElementById('m-profit').textContent = pltTelemetry.profit.toFixed(2);
  document.getElementById('m-love').textContent = pltTelemetry.love.toFixed(2);
  document.getElementById('m-tax').textContent = pltTelemetry.tax.toFixed(2);
  document.getElementById('m-tv').textContent = tv.toFixed(2);
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
