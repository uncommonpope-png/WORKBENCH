<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLT Covenant & Council Telemetry</title>
<style>
body { background: #0a0d14; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; }
.container { max-width: 1200px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 24px; border-bottom: 1px solid #1e293b; padding-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
.card { background: #131722; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; }
.badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>PLT Covenant & Council Telemetry Visualizer</h1>
<p>Dynamic 4-God Consensus, True Value Telemetry & Covenant Alignment Engine</p>
</div>
<div class="grid" id="council-grid"></div>
</div>
<script>
const council = [
  { name: 'Profit Prime', ratio: 'PLT 0.90 / 0.05 / 0.05', voice: 'If it does not multiply, it does not matter.', color: '#10b981' },
  { name: 'Love Weaver', ratio: 'PLT 0.10 / 0.85 / 0.05', voice: 'Nothing grows that people do not stay for.', color: '#ec4899' },
  { name: 'Tax Collector', ratio: 'PLT 0.05 / 0.05 / 0.90', voice: 'Everything is paid for. If not now, later.', color: '#f59e0b' },
  { name: 'Harvester', ratio: 'PLT 0.40 / 0.30 / 0.30', voice: 'There is always something to take.', color: '#8b5cf6' }
];
function init() {
  const grid = document.getElementById('council-grid');
  grid.innerHTML = council.map(god => `
    <div class="card" style="border-top: 4px solid ${god.color}">
      <h3>${god.name}</h3>
      <p class="badge" style="background: ${god.color}22; color: ${god.color}">${god.ratio}</p>
      <p><em>"${god.voice}"</em></p>
    </div>
  `).join('');
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
