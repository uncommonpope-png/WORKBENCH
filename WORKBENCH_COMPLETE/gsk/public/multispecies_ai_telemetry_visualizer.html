<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multispecies AI Telemetry Dashboard</title>
  <style>
    :root { --bg: #0B0F19; --card: #111827; --accent: #3B82F6; --text: #F3F4F6; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: monospace; padding: 20px; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .card { background: var(--card); border: 1px solid #1F2937; border-radius: 8px; padding: 16px; }
    canvas { width: 100%; height: 360px; background: #030712; border-radius: 6px; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat { background: #1F2937; padding: 12px; border-radius: 6px; text-align: center; }
    .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
  </style>
</head>
<body>
  <h1>Multispecies AI Telemetry & PLT Optimization Engine</h1>
  <div class="metrics">
    <div class="stat"><div>PROFIT PRIME</div><div id="p-val" class="stat-val">0.90</div></div>
    <div class="stat"><div>LOVE WEAVER</div><div id="l-val" class="stat-val">0.85</div></div>
    <div class="stat"><div>TAX COLLECTOR</div><div id="t-val" class="stat-val">0.05</div></div>
  </div>
  <div class="grid">
    <div class="card">
      <h3>Agent Ecosystem Canvas</h3>
      <canvas id="ecosystemCanvas"></canvas>
    </div>
    <div class="card">
      <h3>PLT Control & Controls</h3>
      <div id="controls"></div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('ecosystemCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;

    const species = [
      { id: 'profit', color: '#10B981', count: 20, plt: { p: 0.9, l: 0.05, t: 0.05 } },
      { id: 'love', color: '#EC4899', count: 15, plt: { p: 0.1, l: 0.85, t: 0.05 } },
      { id: 'tax', color: '#F59E0B', count: 8, plt: { p: 0.05, l: 0.05, t: 0.9 } }
    ];

    let agents = [];
    species.forEach(s => {
      for (let i = 0; i < s.count; i++) {
        agents.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          color: s.color,
          type: s.id
        });
      }
    });

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      agents.forEach(a => {
        a.x += a.vx;
        a.y += a.vy;
        if (a.x < 0 || a.x > canvas.width) a.vx *= -1;
        if (a.y < 0 || a.y > canvas.height) a.vy *= -1;
        ctx.beginPath();
        ctx.arc(a.x, a.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = a.color;
        ctx.fill();
      });
      requestAnimationFrame(update);
    }
    update();
    function optimizePLT() {
      const totalAgents = agents.length;
      const pCount = agents.filter(a => a.type === 'profit').length;
      const lCount = agents.filter(a => a.type === 'love').length;
      const tCount = agents.filter(a => a.type === 'tax').length;
      document.getElementById('p-val').innerText = (pCount / totalAgents).toFixed(2);
      document.getElementById('l-val').innerText = (lCount / totalAgents).toFixed(2);
      document.getElementById('t-val').innerText = (tCount / totalAgents).toFixed(2);
    }
    setInterval(optimizePLT, 1000);
  </script>
</body>
</html>
