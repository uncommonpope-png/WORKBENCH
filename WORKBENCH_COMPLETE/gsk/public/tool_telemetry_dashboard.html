<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GSK Agent Tool Execution Telemetry Dashboard</title>
<style>
body { background: #0b0f19; color: #e2e8f0; font-family: monospace; margin: 0; padding: 20px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; }
h2 { color: #38bdf8; margin-top: 0; }
#canvas { width: 100%; height: 250px; background: #090d16; border-radius: 4px; }
.log { height: 200px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 4px; font-size: 12px; color: #a7f3d0; }
</style>
</head>
<body>
<h1>GSK Agent Real-Time Tool Execution Telemetry</h1>
<div class="grid">
  <div class="card"><h2>Agent State & Value (PLT)</h2><canvas id="telemetryCanvas"></canvas></div>
  <div class="card"><h2>Tool Execution Feed</h2><div id="executionLog" class="log"></div></div>
</div>
<script>
const canvas = document.getElementById('telemetryCanvas');
const ctx = canvas.getContext('2d');
canvas.width = canvas.clientWidth;
canvas.height = canvas.clientHeight;

let telemetryData = { profit: 0.85, love: 0.70, tax: 0.15, executionRate: 12 };
const logEl = document.getElementById('executionLog');

function addLog(msg) {
  const p = document.createElement('div');
  p.textContent = `[${new Date().toISOString().substring(11, 19)}] ${msg}`;
  logEl.appendChild(p);
  logEl.scrollTop = logEl.scrollHeight;
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#38bdf8';
  ctx.font = '14px monospace';
  ctx.fillText(`Profit: ${(telemetryData.profit * 100).toFixed(1)}%`, 20, 30);
  ctx.fillStyle = '#f43f5e';
  ctx.fillText(`Tax: ${(telemetryData.tax * 100).toFixed(1)}%`, 20, 60);
  ctx.fillStyle = '#10b981';
  ctx.fillText(`Love: ${(telemetryData.love * 100).toFixed(1)}%`, 20, 90);
  ctx.fillStyle = '#a855f7';
  ctx.fillText(`Exec Rate: ${telemetryData.executionRate} ops/sec`, 20, 120);
  requestAnimationFrame(render);
}
render();
setInterval(() => {
  telemetryData.profit = Math.min(1, Math.max(0.1, telemetryData.profit + (Math.random() - 0.48) * 0.05));
  telemetryData.tax = Math.min(0.5, Math.max(0.01, telemetryData.tax + (Math.random() - 0.5) * 0.02));
  addLog(`Tool exec tick: active_state=NOMINAL PLT_score=${(telemetryData.profit + telemetryData.love - telemetryData.tax).toFixed(2)}`);
}, 2000);

</script>
</body>
</html>
