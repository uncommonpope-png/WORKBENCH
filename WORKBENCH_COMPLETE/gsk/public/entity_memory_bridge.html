<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Entity Memory Bridge - .gsv Inspector</title>
<style>
body { font-family: monospace; background: #0b0f19; color: #00ffcc; padding: 20px; }
.card { border: 1px solid #00ffcc; padding: 15px; margin-bottom: 15px; border-radius: 4px; background: rgba(0,255,204,0.05); }
h1, h2 { color: #ffffff; }
button { background: #00ffcc; color: #0b0f19; border: none; padding: 8px 16px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<h1>Entity Memory Bridge (.gsv)</h1>
<div class="card">
<h2>Active Capsule State</h2>
<pre id="capsule-display">Loading .gsv data...</pre>
<button onclick="exportCapsule()">Export .gsv Capsule</button>
</div>
<script>
const currentCapsule = {
  header: 'GSV-CAPSULE-v1',
  identity: { id: 'entity-prime-001', name: 'GSK Sovereign', archetype: 'Grand Code Pope' },
  skills: ['telemetry-visualization', 'plt-optimization', 'gsv-serialization'],
  pltBalance: { profit: 0.9, love: 0.85, tax: 0.05 }
};
document.getElementById('capsule-display').textContent = JSON.stringify(currentCapsule, null, 2);
function exportCapsule() {
  const blob = new Blob([JSON.stringify(currentCapsule, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${currentCapsule.identity.id}.gsv`;
  a.click();
}
</script>
</body>
</html>
