<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Spatial Agent Embodiment & PLT Telemetry Workspace</title>
  <style>
    body { margin: 0; overflow: hidden; background: #04060a; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    #hud { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(10, 15, 26, 0.85); border: 1px solid rgba(0, 255, 170, 0.3); padding: 18px; border-radius: 12px; backdrop-filter: blur(12px); width: 320px; shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: auto; }
    h1 { font-size: 1.1rem; margin: 0 0 10px 0; color: #00ffaa; letter-spacing: 0.05em; text-transform: uppercase; }
    .metric-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin: 6px 0; font-mono: monospace; }
    .bar-bg { width: 100%; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 2px; }
    .bar-fill { height: 100%; transition: width 0.3s ease; }
    #profit-bar { background: #00ff88; }
    #love-bar { background: #ff3388; }
    #tax-bar { background: #ffaa00; }
    #plt-score { font-size: 1.4rem; font-weight: bold; color: #00e5ff; margin-top: 10px; text-align: center; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="hud">
    <h1>Spatial Embodiment Telemetry</h1>
    <div id="metrics">
      <div class="metric-row"><span>PROFIT (P):</span><span id="val-p">0.85</span></div>
      <div class="bar-bg"><div id="profit-bar" class="bar-fill" style="width: 85%"></div></div>
      <div class="metric-row"><span>LOVE (L):</span><span id="val-l">0.72</span></div>
      <div class="bar-bg"><div id="love-bar" class="bar-fill" style="width: 72%"></div></div>
      <div class="metric-row"><span>TAX (T):</span><span id="val-t">0.18</span></div>
      <div class="bar-bg"><div id="tax-bar" class="bar-fill" style="width: 18%"></div></div>
      <div id="plt-score">TRUE VALUE: +1.39</div>
    </div>
  </div>
  <script>
    // 3D Spatial Embodiment & PLT Telemetry WebGL Engine
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x04060a, 0.035);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 6, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Grid & Ambient Lights
    const grid = new THREE.GridHelper(40, 40, 0x00ffaa, 0x1e293b);
    grid.position.y = -2;
    scene.add(grid);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // 4 Gods Council Nodes
    const councilNodes = [
      { name: 'Profit Prime', color: 0x00ff88, radius: 1.2, pos: [-4, 1, 0], plt: { p: 0.9, l: 0.05, t: 0.05 } },
      { name: 'Love Weaver', color: 0xff3388, radius: 1.2, pos: [4, 1, 0], plt: { p: 0.1, l: 0.85, t: 0.05 } },
      { name: 'Tax Collector', color: 0xffaa00, radius: 1.2, pos: [0, 4, -3], plt: { p: 0.05, l: 0.05, t: 0.9 } },
      { name: 'Harvester', color: 0x9900ff, radius: 1.4, pos: [0, -0.5, 3], plt: { p: 0.4, l: 0.3, t: 0.3 } }
    ];

    const meshes = [];
    councilNodes.forEach(n => {
      const geo = new THREE.IcosahedronGeometry(n.radius, 2);
      const mat = new THREE.MeshStandardMaterial({ color: n.color, wireframe: true, roughness: 0.2, metalness: 0.8 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(...n.pos);
      mesh.userData = n;
      scene.add(mesh);
      meshes.push(mesh);
    });

    // Central Core Agent Sphere
    const agentGeo = new THREE.SphereGeometry(0.8, 32, 32);
    const agentMat = new THREE.MeshStandardMaterial({ color: 0x00e5ff, emissive: 0x005577, roughness: 0.1 });
    const agentCore = new THREE.Mesh(agentGeo, agentMat);
    scene.add(agentCore);

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      
      meshes.forEach((m, idx) => {
        m.rotation.x = t * 0.4 * (idx + 1);
        m.rotation.y = t * 0.6 * (idx + 1);
        m.position.y += Math.sin(t * 2 + idx) * 0.005;
      });

      agentCore.position.x = Math.sin(t * 0.8) * 2;
      agentCore.position.z = Math.cos(t * 0.8) * 2;
      agentCore.position.y = Math.sin(t * 1.5) * 0.5;

      // Dynamic Telemetry recalculation
      const liveP = (0.7 + Math.sin(t * 1.2) * 0.2).toFixed(2);
      const liveL = (0.65 + Math.cos(t * 0.9) * 0.25).toFixed(2);
      const liveT = (0.15 + Math.sin(t * 0.5) * 0.1).toFixed(2);
      const tv = (parseFloat(liveP) + parseFloat(liveL) - parseFloat(liveT)).toFixed(2);

      document.getElementById('val-p').innerText = liveP;
      document.getElementById('val-l').innerText = liveL;
      document.getElementById('val-t').innerText = liveT;
      document.getElementById('profit-bar').style.width = (liveP * 100) + '%';
      document.getElementById('love-bar').style.width = (liveL * 100) + '%';
      document.getElementById('tax-bar').style.width = (liveT * 100) + '%';
      document.getElementById('plt-score').innerText = `TRUE VALUE: ${tv > 0 ? '+' : ''}${tv}`;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
