<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telemetry Insight & Optimization Visualizer</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
.container { max-width: 1000px; margin: 0 auto; }
.card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
canvas { width: 100%; height: 300px; background: #090d16; border-radius: 8px; }
.insight-box { background: #0284c715; border-left: 4px solid #38bdf8; padding: 16px; border-radius: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>Agentic Telemetry & Insight Engine</h1>
  <div class="card">
    <canvas id="telemetryChart"></canvas>
  </div>
  <div class="card insight-box" id="insightDisplay"></div>
</div>
<script>
const canvas = document.getElementById('telemetryChart');
const ctx = canvas.getContext('2d');
canvas.width = canvas.clientWidth;
canvas.height = canvas.clientHeight;

const samples = [
  { step: 1, latencyMs: 340, memoryMB: 120, cacheHitRatio: 0.15 },
  { step: 2, latencyMs: 290, memoryMB: 125, cacheHitRatio: 0.28 },
  { step: 3, latencyMs: 180, memoryMB: 110, cacheHitRatio: 0.65 },
  { step: 4, latencyMs: 85,  memoryMB: 95,  cacheHitRatio: 0.92 }
];

function renderChart() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 3;
  ctx.beginPath();
  const stepX = canvas.width / (samples.length - 1);
  samples.forEach((s, i) => {
    const x = i * stepX;
    const y = canvas.height - (s.latencyMs / 400) * (canvas.height - 40);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

renderChart();
document.getElementById('insightDisplay').innerHTML = `
  <h3>Discovered Telemetry Insight</h3>
  <p><strong>Insight:</strong> Increasing context-cache retention to 90%+ decreases agent query latency by 75% (from 340ms to 85ms).</p>
  <p><strong>Implemented Improvement:</strong> Enabled adaptive telemetry-driven LRU cache warmups during agent initialization.</p>
`;
</script>
</body>
</html>
