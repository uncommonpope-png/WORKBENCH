<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enactive Cognition Telemetry Visualizer</title>
<style>
body { margin: 0; background: #07090e; color: #00ffcc; font-family: 'Courier New', monospace; overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100vh; padding: 16px; box-sizing: border-box; }
.header { font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid #1a3a4b; padding-bottom: 8px; margin-bottom: 12px; letter-spacing: 1px; color: #00ffcc; display: flex; justify-content: space-between; }
#stage { flex: 1; border: 1px solid #1a3a4b; background: #04060a; border-radius: 4px; position: relative; }
canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <span>ENACTIVE COGNITION TELEMETRY — SENSORIMOTOR LOOP DYNAMICS</span>
    <span id="plt-indicator">PLT NET: +0.80</span>
  </div>
  <div id="stage">
    <canvas id="telemetryCanvas"></canvas>
  </div>
</div>
<script>
const canvas = document.getElementById('telemetryCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
window.addEventListener('resize', resize); resize();

const state = { perception: 0.5, action: 0.5, coupling: 0.8, profit: 0.9, love: 0.85, tax: 0.1 };

function updateState() {
  const t = Date.now() * 0.002;
  state.perception = 0.5 + 0.4 * Math.sin(t);
  state.action = 0.5 + 0.4 * Math.cos(t * 1.3);
  state.coupling = 0.5 + 0.4 * Math.sin(t * 0.7);
}

function drawTelemetry() {
  updateState();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const radius = Math.min(cx, cy) * 0.5;
  
  ctx.strokeStyle = '#1a3a4b'; ctx.lineWidth = 1; ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.stroke();
  
  const px = cx + Math.cos(Date.now() * 0.0015) * radius * state.perception;
  const py = cy + Math.sin(Date.now() * 0.0015) * radius * state.perception;
  const ax = cx + Math.cos(Date.now() * 0.002) * radius * state.action;
  const ay = cy + Math.sin(Date.now() * 0.002) * radius * state.action;
  
  ctx.strokeStyle = 'rgba(0, 255, 204, 0.6)'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(px, py); ctx.lineTo(ax, ay); ctx.stroke();
  
  ctx.fillStyle = '#00ffcc'; ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff00aa'; ctx.beginPath(); ctx.arc(ax, ay, 6, 0, Math.PI * 2); ctx.fill();
  
  ctx.fillStyle = '#00ffcc'; ctx.font = '12px monospace';
  ctx.fillText(`PERCEPTION LOOP: ${state.perception.toFixed(3)}`, 20, 30);
  ctx.fillText(`ACTION DYNAMICS: ${state.action.toFixed(3)}`, 20, 50);
  ctx.fillText(`SENSORIMOTOR COUPLING: ${state.coupling.toFixed(3)}`, 20, 70);
  
  requestAnimationFrame(drawTelemetry);
}
drawTelemetry();
</script>
</body>
</html>
