<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Self-Model Telemetry Dashboard</title>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: monospace; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; }
    .metric { font-size: 2em; color: #38bdf8; font-weight: bold; }
    .plt-positive { color: #4ade80; }
    .plt-label { color: #94a3b8; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Agent Self-Model Telemetry Dashboard</h1>
  <div class="grid">
    <div class="card">
      <div class="plt-label">Cognitive Valence</div>
      <div id="valence" class="metric">0.85</div>
    </div>
    <div class="card">
      <div class="plt-label">PLT Score (Profit + Love - Tax)</div>
      <div id="pltScore" class="metric plt-positive">+1.62</div>
    </div>
    <div class="card">
      <div class="plt-label">Sacred Resonance</div>
      <div id="resonance" class="metric">0.91</div>
    </div>
  </div>
</body>
</html>
