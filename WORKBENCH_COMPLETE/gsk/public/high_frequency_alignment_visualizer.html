<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>High-Frequency Self-Observation Visualizer</title>
<style>
body { background: #0a0a12; color: #e0e0e0; font-family: monospace; margin: 0; padding: 20px; }
.card { background: #121220; border: 1px solid #2a2a40; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
canvas { width: 100%; height: 350px; background: #05050a; display: block; border-radius: 4px; }
</style>
</head>
<body>
<div class="card">
<h1>High-Frequency Self-Observation & Real-Time Alignment Telemetry</h1>
<p>Monitoring high-frequency introspection loops and PLT alignment state.</p>
<canvas id="alignmentCanvas"></canvas>
</div>
<script>
const canvas = document.getElementById('alignmentCanvas');
const ctx = canvas.getContext('2d');
let history = [];
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#00ffcc';
  ctx.font = '14px monospace';
  ctx.fillText('High-Frequency Introspection Active | PLT Score: 1.20', 20, 30);
  ctx.strokeStyle = '#00ffcc';
  ctx.beginPath();
  ctx.moveTo(20, 150);
  for(let i=0; i<history.length; i++) {
    ctx.lineTo(20 + i * 5, 150 - history[i] * 50);
  }
  ctx.stroke();
}
setInterval(() => {
  const pltValue = 1.0 + Math.random() * 0.4 - Math.random() * 0.1;
  history.push(pltValue);
  if(history.length > 100) history.shift();
  render();
}, 100);
</script>
</body>
</html>
