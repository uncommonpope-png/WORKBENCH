<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PLT Economy Sandbox - Real-Time Doctrine Optimization</title>
  <style>
    body { background: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
    .header { border-bottom: 2px solid #66fcf1; padding-bottom: 10px; margin-bottom: 20px; }
    h1 { color: #66fcf1; margin: 0; font-size: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: #1f2833; border: 1px solid #45a29e; border-radius: 8px; padding: 15px; }
    .slider-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #45a29e; font-weight: bold; }
    input[type=range] { width: 100%; }
    .metric-val { float: right; color: #66fcf1; font-weight: bold; }
    #canvas { background: #0b0c10; border: 1px solid #45a29e; border-radius: 4px; width: 100%; height: 250px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>PLT Economy Sandbox</h1>
    <small>Doctrine: True Value = Profit + Love - Tax</small>
  </div>
  <div class="grid">
    <div class="card">
      <h3>Parameter Control Panel</h3>
      <div class="slider-group">
        <label>Profit Weight <span id="val-profit" class="metric-val">1.0</span></label>
        <input type="range" id="input-profit" min="0" max="3" step="0.1" value="1.0" oninput="updateSim()">
      </div>
      <div class="slider-group">
        <label>Love Weight <span id="val-love" class="metric-val">1.0</span></label>
        <input type="range" id="input-love" min="0" max="3" step="0.1" value="1.0" oninput="updateSim()">
      </div>
      <div class="slider-group">
        <label>Tax Friction <span id="val-tax" class="metric-val">0.2</span></label>
        <input type="range" id="input-tax" min="0" max="2" step="0.05" value="0.2" oninput="updateSim()">
      </div>
    </div>
    <div class="card">
      <h3>Real-Time Optimization Yield</h3>
      <canvas id="canvas"></canvas>
      <div style="margin-top:10px;">True Value Score: <span id="tv-score" style="color:#66fcf1; font-size:20px; font-weight:bold;">0.80</span></div>
    </div>
  </div>
  <script>
    function updateSim() {
      const p = parseFloat(document.getElementById('input-profit').value);
      const l = parseFloat(document.getElementById('input-love').value);
      const t = parseFloat(document.getElementById('input-tax').value);
      document.getElementById('val-profit').textContent = p.toFixed(1);
      document.getElementById('val-love').textContent = l.toFixed(1);
      document.getElementById('val-tax').textContent = t.toFixed(2);
      const tv = p + l - t;
      document.getElementById('tv-score').textContent = tv.toFixed(2);
    }
    window.onload = updateSim;
  </script>
</body>
</html>
