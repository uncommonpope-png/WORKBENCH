<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Self-Model Emergence & Sovereign PLT Dashboard</title>
<style>body { margin: 0; overflow: hidden; background: #05050a; color: #00ffcc; font-family: monospace; } #canvas-container { width: 100vw; height: 100vh; } #hud { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(5, 5, 10, 0.85); padding: 15px; border: 1px solid #00ffcc; border-radius: 8px; font-size: 13px; pointer-events: none; }</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<div id="hud">
<h2>Sovereign PLT & Self-Model Emergence</h2>
<div>Valence: <span id="val-disp">0.18</span> | Arousal: <span id="aro-disp">0.36</span></div>
<div>PLT Score: <span id="plt-disp">+0.85</span></div>
<div>Emergence State: <span id="state-disp">INTEGRATED_SOVEREIGN</span></div>
</div>
<script>const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 50;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const particleCount = 3000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount * 3; i++) {
  positions[i] = (Math.random() - 0.5) * 100;
  colors[i] = Math.random();
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const material = new THREE.PointsMaterial({ size: 0.8, vertexColors: true, transparent: true, opacity: 0.8 });
const particles = new THREE.Points(geometry, material);
scene.add(particles);

function animate() {
  requestAnimationFrame(animate);
  particles.rotation.x += 0.002;
  particles.rotation.y += 0.003;
  renderer.render(scene, camera);
}
animate();
</script></body></html>
