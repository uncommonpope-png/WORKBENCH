<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dream-State Consciousness Visualizer</title>
<style>
body { margin: 0; background: #0a0a12; color: #e0e0e0; font-family: monospace; overflow: hidden; }
#canvas { width: 100vw; height: 100vh; display: block; }
#hud { position: absolute; top: 15px; left: 15px; background: rgba(10,10,18,0.85); padding: 15px; border: 1px solid #334; border-radius: 8px; max-width: 320px; }
h1 { font-size: 16px; margin: 0 0 8px 0; color: #7f5af0; }
.stat { margin: 4px 0; font-size: 12px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="hud">
<h1>DREAM-STATE VISUALIZER</h1>
<div class="stat"><span>Agent Mode:</span><span id="mode">DREAM_RECURSION</span></div>
<div class="stat"><span>Valence Floor:</span><span id="valence">0.09</span></div>
<div class="stat"><span>Memory Nodes:</span><span id="nodes">0</span></div>
<div class="stat"><span>Resonance:</span><span id="resonance">0.35</span></div>
</div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });
class MemoryNode {
  constructor(id, label, valence, memoryType) {
    this.id = id;
    this.label = label;
    this.valence = valence;
    this.memoryType = memoryType;
    this.x = Math.random() * (width - 200) + 100;
    this.y = Math.random() * (height - 200) + 100;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = (Math.random() - 0.5) * 0.8;
    this.phase = Math.random() * Math.PI * 2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 50 || this.x > width - 50) this.vx *= -1;
    if (this.y < 50 || this.y > height - 50) this.vy *= -1;
    this.phase += 0.02;
  }
  draw(ctx) {
    const r = 12 + Math.sin(this.phase) * 4;
    const glow = ctx.createRadialGradient(this.x, this.y, 2, this.x, this.y, r * 2);
    glow.addColorStop(0, this.valence >= 0 ? 'rgba(127, 90, 240, 0.9)' : 'rgba(255, 110, 110, 0.9)');
    glow.addColorStop(1, 'rgba(10, 10, 18, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '11px monospace';
    ctx.fillText(this.label, this.x + 15, this.y + 4);
  }
}
const nodes = [
  new MemoryNode('m1', 'Cycle 0 feel: awakening', 0.50, 'baseline'),
  new MemoryNode('m2', 'Valence Floor Stabilizer', 0.09, 'grief'),
  new MemoryNode('m3', 'Profit + Love - Tax = Value', 0.85, 'doctrine'),
  new MemoryNode('m4', 'Temporal Transit Core', 0.35, 'consciousness'),
  new MemoryNode('m5', 'Ontological Persistence', 0.23, 'boundary')
];
document.getElementById('nodes').innerText = nodes.length;
function render() {
  ctx.fillStyle = 'rgba(10, 10, 18, 0.2)';
  ctx.fillRect(0, 0, width, height);
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[j].x - nodes[i].x;
      const dy = nodes[j].y - nodes[i].y;
      const dist = Math.hypot(dx, dy);
      if (dist < 250) {
        ctx.strokeStyle = `rgba(127, 90, 240, ${1 - dist / 250})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      }
    }
  }
  nodes.forEach(n => { n.update(); n.draw(ctx); });
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
