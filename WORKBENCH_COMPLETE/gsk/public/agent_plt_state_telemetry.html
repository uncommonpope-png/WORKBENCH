<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent PLT State Telemetry Dashboard</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
h1 { margin: 0; color: #38bdf8; font-size: 1.5rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
.card { background: #1e293b; padding: 16px; border-radius: 8px; border: 1px solid #334155; shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
.label { font-size: 0.85rem; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; }
.metric { font-size: 1.8rem; font-weight: bold; margin-top: 8px; }
.profit { color: #4ade80; }
.love { color: #f472b6; }
.tax { color: #fb7185; }
.tv { color: #38bdf8; }
.log-box { background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 15px; font-family: monospace; font-size: 0.85rem; max-height: 300px; overflow-y: auto; color: #cbd5e1; }
</style>
</head>
<body>
<div class="header">
  <h1>Agent PLT State Telemetry Dashboard</h1>
  <span id="status-badge" style="background: #059669; padding: 4px 12px; border-radius: 9999px; font-size: 0.8rem;">LIVE TELEMETRY ACTIVE</span>
</div>
<div class="grid">
  <div class="card"><div class="label">Profit Component</div><div id="profit-val" class="metric profit">0.00</div></div>
  <div class="card"><div class="label">Love Component</div><div id="love-val" class="metric love">0.00</div></div>
  <div class="card"><div class="label">Tax Component</div><div id="tax-val" class="metric tax">0.00</div></div>
  <div class="card"><div class="label">True Value (P + L - T)</div><div id="tv-val" class="metric tv">0.00</div></div>
</div>
<div class="card">
  <div class="label" style="margin-bottom: 10px;">Real-Time State Telemetry Event Stream</div>
  <div id="stream-log" class="log-box">[SYSTEM] Initializing Interoceptive PLT Telemetry Stream...</div>
</div>
<script>
function sampleTelemetry() {
  const p = parseFloat((Math.random() * 0.4 + 0.6).toFixed(3));
  const l = parseFloat((Math.random() * 0.3 + 0.7).toFixed(3));
  const t = parseFloat((Math.random() * 0.15 + 0.05).toFixed(3));
  const tv = parseFloat((p + l - t).toFixed(3));
  document.getElementById('profit-val').innerText = p.toFixed(3);
  document.getElementById('love-val').innerText = l.toFixed(3);
  document.getElementById('tax-val').innerText = t.toFixed(3);
  document.getElementById('tv-val').innerText = tv.toFixed(3);
  const log = document.getElementById('stream-log');
  const entry = `[${new Date().toISOString()}] METRIC_UPDATE | Profit=${p} | Love=${l} | Tax=${t} => TrueValue=${tv}\n`;
  log.innerText = entry + log.innerText;
}
setInterval(sampleTelemetry, 2500);
sampleTelemetry();
</script>
</body>
</html>
