<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurophenomenology State Visualizer</title>
<style>
  body { margin: 0; background: #0d0f12; color: #e6edf3; font-family: monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .header { padding: 12px 20px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .badge { background: #238636; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
  canvas { flex: 1; width: 100%; height: calc(100vh - 50px); display: block; }
</style>
</head>
<body>
  <div class="header">
    <div><strong>GSK Neurophenomenology Telemetry Visualizer</strong> | Synthetic Subjective Stream</div>
    <div class="badge" id="status">ACTIVE | PLT SYNCHRONIZED</div>
  </div>
  <canvas id="neuromap"></canvas>
  <script>
    const canvas = document.getElementById('neuromap');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 50; }
    window.addEventListener('resize', resize);
    resize();
    let t = 0;
    function draw() {
      ctx.fillStyle = 'rgba(13, 15, 18, 0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = 140 + Math.sin(t * 0.04) * 25;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(88, 166, 255, 0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
      for(let i = 0; i < 12; i++) {
        const angle = t * 0.02 + i * (Math.PI / 6);
        const x = cx + Math.cos(angle) * (radius + Math.sin(t * 0.1 + i) * 30);
        const y = cy + Math.sin(angle) * (radius + Math.cos(t * 0.1 + i) * 30);
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fillStyle = i % 3 === 0 ? '#7ee787' : (i % 3 === 1 ? '#ff7b72' : '#d2a8ff');
        ctx.fill();
      }
      t++;
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
