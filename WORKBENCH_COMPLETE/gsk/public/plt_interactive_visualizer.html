<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PLT Telemetry Visualizer & Optimizer</title>
<style>
body { font-family: monospace; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
.card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
canvas { width: 100%; height: 250px; background: #020617; border-radius: 4px; }
.controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
label { display: flex; flex-direction: column; font-size: 12px; font-weight: bold; color: #94a3b8; }
input[type=range] { margin-top: 5px; }
.metric-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
</style>
</head>
<body>
<div class="card">
<h2>PLT Telemetry Optimizer & Visualizer</h2>
<div id="pltScore" style="font-size: 24px; color: #38bdf8; font-weight: bold;">PLT Net Score: 0.00</div>
<canvas id="telemetryCanvas"></canvas>
<div class="controls">
<label>Profit Weight: <span id="pVal">0.90</span><input type="range" id="pRange" min="0" max="2" step="0.05" value="0.90"></label>
<label>Love Weight: <span id="lVal">0.85</span><input type="range" id="lRange" min="0" max="2" step="0.05" value="0.85"></label>
<label>Tax Drag: <span id="tVal">0.05</span><input type="range" id="tRange" min="0" max="2" step="0.05" value="0.05"></label>
</div>
</div>
<script>
const canvas = document.getElementById('telemetryCanvas');
const ctx = canvas.getContext('2d');
let history = [];

function updateMetrics() {
  const p = parseFloat(document.getElementById('pRange').value);
  const l = parseFloat(document.getElementById('lRange').value);
  const t = parseFloat(document.getElementById('tRange').value);
  document.getElementById('pVal').textContent = p.toFixed(2);
  document.getElementById('lVal').textContent = l.toFixed(2);
  document.getElementById('tVal').textContent = t.toFixed(2);
  const net = (p + l - t).toFixed(2);
  document.getElementById('pltScore').textContent = `PLT Net Score: ${net}`;
  history.push(parseFloat(net));
  if (history.length > 50) history.shift();
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const step = canvas.width / 50;
  history.forEach((val, i) => {
    const y = canvas.height - ((val + 2) / 6) * canvas.height;
    if (i === 0) ctx.moveTo(0, y);
    else ctx.lineTo(i * step, y);
  });
  ctx.stroke();
}

['pRange', 'lRange', 'tRange'].forEach(id => document.getElementById(id).addEventListener('input', updateMetrics));
setInterval(updateMetrics, 500);
updateMetrics();
</script>
</body>
</html>
