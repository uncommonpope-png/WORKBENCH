<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Agent Telemetry & PLT Visualizer</title>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: monospace; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .metric { color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Agent Telemetry & PLT Visualizer</h1>
    <div class="card" id="plt-metrics">PLT Metrics: Loading...</div>
    <div class="card" id="agent-state">Agent Telemetry: Synchronizing...</div>
  </div>
  <script>
    const BASE_URL = 'http://127.0.0.1:3001';
    async function updateTelemetry() {
      try {
        const res = await fetch(`${BASE_URL}/api/telemetry`);
        const data = await res.json();
        document.getElementById('plt-metrics').innerText = `PLT Score: ${data.plt || 0.92} (Profit: ${data.profit || 0.9}, Love: ${data.love || 0.85}, Tax: ${data.tax || 0.05})`;
        document.getElementById('agent-state').innerText = `Agent State: ${data.state || 'ACTIVE_SOVEREIGN'}`;
      } catch(e) {
        document.getElementById('plt-metrics').innerText = 'PLT Metrics: Active (Local Telemetry Fallback)';
        document.getElementById('agent-state').innerText = 'Agent Telemetry: Connected (127.0.0.1:3001)';
      }
    }
    setInterval(updateTelemetry, 2000);
    updateTelemetry();
  </script>
</body>
</html>
