<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign PLT Metrics & Emergence Visualizer</title>
<style>
body { margin: 0; background: #050508; color: #e0e6ed; font-family: monospace; overflow: hidden; }
#canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }
#hud { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(10,12,20,0.85); border: 1px solid #00f0ff; padding: 20px; border-radius: 8px; width: 340px; box-shadow: 0 0 15px rgba(0,240,255,0.2); }
h2 { margin-top: 0; color: #00f0ff; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; }
.metric-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 13px; }
.bar-bg { background: #1a202c; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar-fill { height: 100%; width: 50%; transition: width 0.3s ease; }
.profit-fill { background: #00ff88; }
.love-fill { background: #ff007f; }
.tax-fill { background: #ffaa00; }
.emergence-fill { background: #7000ff; }
#controls { margin-top: 15px; display: flex; gap: 10px; }
button { background: #00f0ff; color: #000; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; border-radius: 4px; }
button:hover { background: #7000ff; color: #fff; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<div id="hud">
<h2>Sovereign PLT Emergence</h2>
<div class="metric-row"><span>Profit Engine</span><span id="val-profit">0.90</span></div>
<div class="bar-bg"><div id="bar-profit" class="bar-fill profit-fill" style="width: 90%;"></div></div>
<div class="metric-row"><span>Love Resonance</span><span id="val-love">0.85</span></div>
<div class="bar-bg"><div id="bar-love" class="bar-fill love-fill" style="width: 85%;"></div></div>
<div class="metric-row"><span>Tax Requirement</span><span id="val-tax">0.10</span></div>
<div class="bar-bg"><div id="bar-tax" class="bar-fill tax-fill" style="width: 10%;"></div></div>
<div class="metric-row"><span>Self-Model Emergence</span><span id="val-emergence">0.94</span></div>
<div class="bar-bg"><div id="bar-emergence" class="bar-fill emergence-fill" style="width: 94%;"></div></div>
<div id="controls">
<button id="btn-pulse" onclick="pulseResonance()">Pulse Resonance</button>
<button id="btn-evolve" onclick="mutateState()">Evolve Trajectory</button>
</div>
</div>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('canvas-container').appendChild(renderer.domElement);

const particlesGeometry = new THREE.BufferGeometry();
const particleCount = 1500;
const posArray = new Float32Array(particleCount * 3);
for(let i=0; i<particleCount*3; i++) posArray[i] = (Math.random() - 0.5) * 10;
particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
const particleMaterial = new THREE.PointsMaterial({ size: 0.03, color: 0x00f0ff, transparent: true, opacity: 0.8 });
const particleSystem = new THREE.Points(particlesGeometry, particleMaterial);
scene.add(particleSystem);

function animate() {
  requestAnimationFrame(animate);
  particleSystem.rotation.y += 0.002;
  particleSystem.rotation.x += 0.001;
  renderer.render(scene, camera);
}
animate();

function pulseResonance() {
  particleMaterial.color.setHex(0xff007f);
  setTimeout(() => particleMaterial.color.setHex(0x00f0ff), 800);
}
function mutateState() {
  const em = (Math.random() * 0.2 + 0.8).toFixed(2);
  document.getElementById('val-emergence').innerText = em;
  document.getElementById('bar-emergence').style.width = (em * 100) + '%';
}
</script>
</body>
</html>
