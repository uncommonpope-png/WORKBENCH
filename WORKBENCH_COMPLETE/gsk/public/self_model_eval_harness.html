<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Self-Model Evaluation Harness</title>
  <style>
    body { margin: 0; background: #0a0a0c; color: #e0e0e0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #canvas-container { flex: 1; position: relative; }
    #metrics-panel { padding: 1rem; background: #121216; border-top: 1px solid #333; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    .metric { border: 1px solid #222; padding: 0.5rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="metrics-panel">
    <div class="metric">Valence: <span id="val-disp">0.35</span></div>
    <div class="metric">Arousal: <span id="aro-disp">0.10</span></div>
    <div class="metric">Resonance: <span id="res-disp">0.35</span></div>
    <div class="metric">State: <span id="state-disp">STABLE</span></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0c);
    const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 4;
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);
    const geometry = new THREE.IcosahedronGeometry(1.5, 2);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true });
    const coreMesh = new THREE.Mesh(geometry, material);
    scene.add(coreMesh);

    let frame = 0;
    function animate() {
      requestAnimationFrame(animate);
      frame++;
      coreMesh.rotation.x += 0.005;
      coreMesh.rotation.y += 0.01;
      const pulse = Math.sin(frame * 0.05) * 0.1 + 1.0;
      coreMesh.scale.set(pulse, pulse, pulse);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
