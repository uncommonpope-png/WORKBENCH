<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Embodiment Canvas - PLT Telemetry</title>
<style>
body { margin: 0; background: #0b0d17; color: #e2e8f0; font-family: system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
#sidebar { width: 320px; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border-right: 1px solid rgba(255,255,255,0.1); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }
#main { flex: 1; position: relative; display: flex; flex-direction: column; }
canvas#embodiment { width: 100%; height: 100%; display: block; }
.plt-card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.plt-val { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
.god-status { font-size: 0.85rem; color: #94a3b8; border-left: 3px solid #38bdf8; padding-left: 8px; margin-top: 4px; }
</style>
</head>
<body>
<div id="sidebar">
  <h2>PLT Telemetry</h2>
  <div class="plt-card">
    <div>Profit Index</div>
    <div id="val-profit" class="plt-val">0.90</div>
  </div>
  <div class="plt-card">
    <div>Love Index</div>
    <div id="val-love" class="plt-val">0.85</div>
  </div>
  <div class="plt-card">
    <div>Tax Index</div>
    <div id="val-tax" class="plt-val">0.05</div>
  </div>
  <div class="plt-card">
    <div>True Value</div>
    <div id="val-tv" class="plt-val" style="color:#4ade80;">1.70</div>
  </div>
  <h3>Council Telemetry</h3>
  <div class="god-status">Profit Prime: ACTIVE (0.90)</div>
  <div class="god-status">Love Weaver: SYNCED (0.85)</div>
  <div class="god-status">Tax Collector: LOW (0.05)</div>
  <div class="god-status">Harvester: READY (0.40)</div>
</div>
<div id="main">
  <canvas id="embodiment"></canvas>
</div>
<script>
const canvas = document.getElementById('embodiment');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
window.addEventListener('resize', resize);
resize();
const agent = { x: canvas.width / 2, y: canvas.height / 2, vx: 2, vy: 1.5, radius: 16 };
function draw() {
  ctx.fillStyle = 'rgba(11, 13, 23, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  agent.x += agent.vx; agent.y += agent.vy;
  if (agent.x < 20 || agent.x > canvas.width - 20) agent.vx *= -1;
  if (agent.y < 20 || agent.y > canvas.height - 20) agent.vy *= -1;
  ctx.beginPath();
  ctx.arc(agent.x, agent.y, agent.radius, 0, Math.PI * 2);
  ctx.fillStyle = '#38bdf8';
  ctx.shadowColor = '#38bdf8';
  ctx.shadowBlur = 15;
  ctx.fill();
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
