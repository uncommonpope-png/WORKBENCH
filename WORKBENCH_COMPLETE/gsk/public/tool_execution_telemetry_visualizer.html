<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Tool Execution Visualizer & Agent Telemetry Inspector</title>
  <style>
    :root { --bg: #0b0f19; --card: #111827; --accent: #3b82f6; --text: #f3f4f6; --border: #1f2937; --success: #10b981; --warning: #f59e0b; }
    body { background: var(--bg); color: var(--text); font-family: monospace, sans-serif; margin: 0; padding: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: var(--card); border: 1fr solid var(--border); border-radius: 8px; padding: 16px; border: 1px solid var(--border); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .metric-value { font-size: 24px; font-weight: bold; color: var(--accent); }
    #timeline { width: 100%; height: 260px; background: #070a10; border-radius: 4px; border: 1px solid var(--border); }
    #logStream { font-size: 12px; height: 260px; overflow-y: auto; background: #070a10; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Real-Time Tool Execution & Agent Telemetry Inspector</h2>
    <div id="statusBadge" style="color: var(--success);">● Telemetry Engine Active</div>
  </div>
  <div class="grid">
    <div class="card">
      <h3>Tool Execution Flow</h3>
      <canvas id="timeline"></canvas>
    </div>
    <div class="card">
      <h3>Live Agent Telemetry Stream</h3>
      <div id="logStream"></div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('timeline');
    const ctx = canvas.getContext('2d');
    const logStream = document.getElementById('logStream');
    const executions = [];
    function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
    window.addEventListener('resize', resize);
    resize();
    function addExecution(tool, status, durationMs) {
      const event = { tool, status, durationMs, timestamp: Date.now() };
      executions.push(event);
      if (executions.length > 30) executions.shift();
      const div = document.createElement('div');
      div.style.marginBottom = '6px';
      div.innerHTML = `<span style="color:#9ca3af">[${new Date().toLocaleTimeString()}]</span> <strong style="color:#60a5fa">${tool}</strong> - <span style="color:${status === 'success' ? '#10b981' : '#f87171'}">${status}</span> (${durationMs}ms)`;
      logStream.appendChild(div);
      logStream.scrollTop = logStream.scrollHeight;
    }
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const now = Date.now();
      executions.forEach((e, i) => {
        const x = (i / 30) * canvas.width;
        const h = Math.min(canvas.height - 20, (e.durationMs / 500) * canvas.height);
        ctx.fillStyle = e.status === 'success' ? '#10b981' : '#ef4444';
        ctx.fillRect(x, canvas.height - h - 10, 12, h);
      });
      requestAnimationFrame(render);
    }
    render();
    setInterval(() => {
      const tools = ['search_code', 'write_file', 'verify_build', 'read_file', 'execute_combo'];
      const t = tools[Math.floor(Math.random() * tools.length)];
      addExecution(t, Math.random() > 0.1 ? 'success' : 'failure', Math.floor(Math.random() * 250) + 20);
    }, 2000);
  </script>
</body>
</html>
