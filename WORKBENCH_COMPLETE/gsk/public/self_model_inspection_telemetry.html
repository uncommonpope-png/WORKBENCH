<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Self-Model Inspection & Agent Telemetry Visualizer</title>
<style>
body { background: #0a0b10; color: #e2e8f0; font-family: monospace; padding: 20px; }
.panel { background: #121420; border: 1px solid #2a2f45; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
h1, h2 { color: #38bdf8; }
.metric { display: inline-block; margin-right: 20px; margin-bottom: 10px; }
.val { font-size: 1.4em; color: #4ade80; font-weight: bold; }
#canvas-container { width: 100%; height: 300px; background: #050508; border: 1px solid #1e293b; }
</style>
</head>
<body>
<h1>GSK Live Self-Model & Telemetry Inspector</h1>
<div class="panel">
  <h2>Agent State Telemetry</h2>
  <div class="metric"><span>Valence: </span><span id="val-valence" class="val">0.19</span></div>
  <div class="metric"><span>Arousal: </span><span id="val-arousal" class="val">0.37</span></div>
  <div class="metric"><span>Resonance: </span><span id="val-resonance" class="val">0.35</span></div>
  <div class="metric"><span>Mood: </span><span id="val-mood" class="val">calm</span></div>
</div>
<div class="panel">
  <h2>Real-Time Telemetry Stream</h2>
  <canvas id="telemetryChart" width="800" height="250"></canvas>
</div>
<script>
const canvas = document.getElementById('telemetryChart');
const ctx = canvas.getContext('2d');
let history = Array(50).fill(0.5);

function render() {
  history.push(Math.random() * 0.4 + 0.3);
  history.shift();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const step = canvas.width / (history.length - 1);
  history.forEach((v, i) => {
    const x = i * step;
    const y = canvas.height - (v * canvas.height);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
}
setInterval(render, 1000);
render();
</script>
</body>
</html>
