<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSK Telemetry & Cognitive Cockpit</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: monospace; margin: 0; padding: 20px; }
    .header { font-size: 1.5rem; font-weight: bold; border-bottom: 2px solid #38bdf8; padding-bottom: 10px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; }
    .card h2 { margin-top: 0; color: #38bdf8; font-size: 1.1rem; }
    .metric { font-size: 2rem; font-weight: bold; color: #4ade80; }
  </style>
</head>
<body>
  <div class="header">GSK Telemetry & Identity Visual Cockpit</div>
  <div class="grid">
    <div class="card">
      <h2>System Health</h2>
      <div class="metric" id="health-status">OPTIMAL</div>
    </div>
    <div class="card">
      <h2>PLT Formula Balance</h2>
      <div>Profit: <span style="color:#4ade80">HIGH</span></div>
      <div>Love: <span style="color:#f472b6">SUSTAINED</span></div>
      <div>Tax: <span style="color:#f87171">LOW</span></div>
    </div>
  </div>
</body>
</html>
