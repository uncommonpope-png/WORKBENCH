<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSMCL - Recursive Self-Model Calibration Loop</title>
  <style>
    body { margin: 0; background-color: #0b0c10; color: #66fcf1; font-family: 'Courier New', monospace; padding: 20px; }
    h1 { color: #45a29e; font-size: 1.5rem; text-transform: uppercase; border-bottom: 1px solid #1f2833; padding-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .card { background: #1f2833; border: 1px solid #45a29e; border-radius: 8px; padding: 15px; }
  </style>
</head>
<body>
  <h1>Recursive Self-Model Calibration Loop (RSMCL)</h1>
  <div class="grid">
    <div class="card" id="entropy-card">
      <h3>Interoceptive Telemetry</h3>
      <div id="entropy-metrics">Loading entropy state...</div>
    </div>
    <div class="card" id="active-inference-card">
      <h3>Prediction Error Dynamics</h3>
      <div id="inference-state">Calibrating homeostatic setpoints...</div>
    </div>
  </div>
</body>
</html>
