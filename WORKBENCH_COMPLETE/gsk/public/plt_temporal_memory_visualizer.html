<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLT Temporal Memory & Meta-Observer Visualizer</title>
<style>
  :root { --bg: #0b0f19; --panel: #161b26; --accent: #38bdf8; --text: #f3f4f6; --profit: #22c55e; --love: #ec4899; --tax: #ef4444; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; }
  header { border-bottom: 1px solid #1f2937; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 1.5rem; margin: 0; color: var(--accent); }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  .card { background: var(--panel); border: 1px solid #1f2937; border-radius: 8px; padding: 15px; }
  .card h2 { font-size: 1rem; margin-top: 0; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; }
  canvas { width: 100%; height: 260px; background: #0d1117; border-radius: 4px; }
  .timeline { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; }
  .timeline li { padding: 10px; border-bottom: 1px solid #1f2937; font-size: 0.875rem; display: flex; flex-direction: column; gap: 4px; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; width: fit-content; }
  .badge-profit { background: rgba(34, 197, 94, 0.2); color: var(--profit); }
  .badge-tax { background: rgba(239, 68, 68, 0.2); color: var(--tax); }
</style>
</head>
<body>
<header>
  <h1>PLT Temporal Memory & Higher-Order Thought Visualizer</h1>
  <div id="system-status"><span class="badge badge-profit">State: Dual-Tier Active</span></div>
</header>
<div class="grid">
  <div class="card">
    <h2>Execution vs. Meta-Observer State Transitions</h2>
    <canvas id="chartCanvas"></canvas>
  </div>
  <div class="card">
    <h2>State Transition Memory Feed</h2>
    <ul id="memoryFeed" class="timeline"></ul>
  </div>
</div>
<script>
  const canvas = document.getElementById('chartCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  let points = Array.from({length: 30}, (_, i) => ({ profit: 0.5 + Math.sin(i*0.3)*0.3, love: 0.4 + Math.cos(i*0.2)*0.2, tax: 0.1 + Math.sin(i*0.5)*0.05 }));
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#22c55e'; ctx.beginPath();
    points.forEach((p, i) => {
      let x = (i / (points.length - 1)) * canvas.width;
      let y = canvas.height - (p.profit * canvas.height * 0.8 + 20);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
  draw();
</script>
</body>
</html>
