<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Synthetic Emotion Engine Telemetry</title>
<style>
body { background: #0b0f19; color: #e2e8f0; font-family: monospace; margin: 0; padding: 20px; }
.grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; }
canvas { width: 100%; height: 300px; background: #0f172a; border-radius: 4px; }
</style>
</head>
<body>
<h1>GSK Synthetic Emotion Engine — Valence & Arousal Telemetry</h1>
<div class="grid-container">
<div class="card"><h2>2D Valence-Arousal State Space</h2><canvas id="vaCanvas"></canvas></div>
<div class="card"><h2>Real-Time Telemetry Stream</h2><canvas id="streamCanvas"></canvas></div>
</div>
<script>
class SyntheticEmotionEngine {
  constructor() {
    this.valence = 0.5;
    this.arousal = 0.5;
    this.history = [];
  }
  update(delta) {
    this.valence = Math.max(-1, Math.min(1, this.valence + (Math.random() - 0.5) * 0.1));
    this.arousal = Math.max(0, Math.min(1, this.arousal + (Math.random() - 0.5) * 0.1));
    this.history.push({ v: this.valence, a: this.arousal, t: Date.now() });
    if (this.history.length > 100) this.history.shift();
  }
}
const engine = new SyntheticEmotionEngine();
function render() {
  engine.update(16);
  const vaCtx = document.getElementById('vaCanvas').getContext('2d');
  vaCtx.clearRect(0, 0, 300, 300);
  vaCtx.strokeStyle = '#475569';
  vaCtx.beginPath(); vaCtx.moveTo(150, 0); vaCtx.lineTo(150, 300); vaCtx.moveTo(0, 150); vaCtx.lineTo(300, 150); vaCtx.stroke();
  const px = (engine.valence + 1) * 150;
  const py = (1 - engine.arousal) * 300;
  vaCtx.fillStyle = '#38bdf8';
  vaCtx.beginPath(); vaCtx.arc(px, py, 8, 0, Math.PI * 2); vaCtx.fill();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
