<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real-Time Stream Visualizer</title>
<style>
body { font-family: monospace; background: #0a0a0c; color: #00ffcc; margin: 0; padding: 20px; }
#canvas { width: 100%; height: 400px; background: #111116; border: 1px solid #00ffcc; }
.metrics { display: flex; gap: 20px; margin-top: 15px; }
.card { background: #181820; padding: 15px; border-radius: 6px; flex: 1; border: 1px solid #333; }
</style>
</head>
<body>
<h1>GSK Real-Time Stream Visualizer</h1>
<div class="metrics">
<div class="card"><h3>Stream Frequency</h3><div id="freq">0 Hz</div></div>
<div class="card"><h3>Feedback Latency</h3><div id="latency">0 ms</div></div>
<div class="card"><h3>Iteration Velocity</h3><div id="velocity">0 ops/s</div></div>
</div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let data = Array(100).fill(0);
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.beginPath();
  ctx.strokeStyle = '#00ffcc';
  ctx.lineWidth = 2;
  for(let i=0; i<data.length; i++) {
    let x = (i / data.length) * canvas.width;
    let y = canvas.height - (data[i] * canvas.height);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}
setInterval(() => {
  data.shift();
  data.push(Math.random());
  document.getElementById('freq').innerText = (10 + Math.random()*5).toFixed(1) + ' Hz';
  document.getElementById('latency').innerText = (12 + Math.random()*4).toFixed(0) + ' ms';
  document.getElementById('velocity').innerText = (45 + Math.random()*10).toFixed(0) + ' ops/s';
  render();
}, 100);
</script>
</body>
</html>
