<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neural State Decoding Telemetry Visualizer</title>
<style>
body { background: #0a0a12; color: #00ffcc; font-family: monospace; margin: 0; padding: 20px; }
.hud { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.panel { border: 1px solid #00ffcc; padding: 15px; background: rgba(0,255,204,0.05); }
canvas { width: 100%; height: 300px; background: #000; border: 1px solid #333; }
</style>
</head>
<body>
<h1>Multi-Agent Neural Telemetry & State Decoding Engine</h1>
<div class="hud">
<div class="panel"><h2>Agent State Vectors</h2><canvas id="vectorCanvas"></canvas></div>
<div class="panel"><h2>PLT Value Stream</h2><canvas id="pltCanvas"></canvas></div>
</div>
<script>
const vCtx = document.getElementById('vectorCanvas').getContext('2d');
const pCtx = document.getElementById('pltCanvas').getContext('2d');
let time = 0;
function render() {
  time += 0.05;
  vCtx.fillStyle = 'rgba(0,0,0,0.2)'; vCtx.fillRect(0,0,600,300);
  vCtx.strokeStyle = '#00ffcc'; vCtx.beginPath();
  for(let x=0; x<600; x+=10) {
    const y = 150 + Math.sin(time + x*0.02) * 50 + Math.cos(time*1.5 + x*0.01) * 30;
    if(x===0) vCtx.moveTo(x,y); else vCtx.lineTo(x,y);
  }
  vCtx.stroke();
  pCtx.fillStyle = 'rgba(0,0,0,0.2)'; pCtx.fillRect(0,0,600,300);
  pCtx.strokeStyle = '#ff00aa'; pCtx.beginPath();
  for(let x=0; x<600; x+=10) {
    const y = 150 + Math.sin(time*0.8 + x*0.015) * 40;
    if(x===0) pCtx.moveTo(x,y); else pCtx.lineTo(x,y);
  }
  pCtx.stroke();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
