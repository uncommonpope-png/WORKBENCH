<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Agent State Visualizer</title>
<style>
body { font-family: monospace; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
#plt-metrics { display: flex; gap: 20px; background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
.metric { border: 1px solid #334155; padding: 10px 15px; border-radius: 6px; flex: 1; }
canvas { background: #020617; border: 1px solid #334155; border-radius: 8px; width: 100%; height: 400px; }
</style>
</head>
<body>
<h1>Live Agent State Visualizer & Telemetry PLT Monitor</h1>
<div id="plt-metrics">
  <div class="metric"><h3>Profit</h3><span id="profit-val">0.00</span></div>
  <div class="metric"><h3>Love</h3><span id="love-val">0.00</span></div>
  <div class="metric"><h3>Tax</h3><span id="tax-val">0.00</span></div>
  <div class="metric"><h3>True Value</h3><span id="tv-val">0.00</span></div>
</div>
<canvas id="telemetry-canvas"></canvas>
<script>
const state = { logs: [], plt: { profit: 0.9, love: 0.8, tax: 0.1 } };
function updatePLT(p, l, t) {
  state.plt.profit = p; state.plt.love = l; state.plt.tax = t;
  const tv = p + l - t;
  document.getElementById('profit-val').innerText = p.toFixed(2);
  document.getElementById('love-val').innerText = l.toFixed(2);
  document.getElementById('tax-val').innerText = t.toFixed(2);
  document.getElementById('tv-val').innerText = tv.toFixed(2);
}
function renderCanvas() {
  const canvas = document.getElementById('telemetry-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#38bdf8';
  ctx.fillText('Agent State Stream: Active Inference Operational', 20, 30);
}
setInterval(renderCanvas, 1000);
updatePLT(0.9, 0.85, 0.05);
</script>
</body>
</html>
