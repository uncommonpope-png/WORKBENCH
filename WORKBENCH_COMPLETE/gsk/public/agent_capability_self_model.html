<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GSK Agent Capability Self-Model Visualizer</title>
<style>
  body { margin:0; padding:20px; background:#0a0c10; color:#e6edf3; font-family:monospace; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
  .card { background:#161b22; border:1fr solid #30363d; border-radius:8px; padding:16px; }
  h2 { color:#58a6ff; margin-top:0; }
  canvas { width:100%; height:300px; background:#0d1117; border-radius:4px; }
</style>
</head>
<body>
<h1>Agent Capability State Dynamics Telemetry</h1>
<div class="grid">
  <div class="card"><h2>Capability State Matrix</h2><canvas id="matrixCanvas"></canvas></div>
  <div class="card"><h2>Real-Time Dynamics Stream</h2><canvas id="streamCanvas"></canvas></div>
</div>
<script>
const state = { profit: 0.9, love: 0.85, tax: 0.1, dynamicLoad: 0.45 };
function render() {
  const mCanvas = document.getElementById('matrixCanvas');
  const sCanvas = document.getElementById('streamCanvas');
  if (mCanvas && sCanvas) {
    const ctx = mCanvas.getContext('2d');
    ctx.clearRect(0, 0, mCanvas.width, mCanvas.height);
    ctx.fillStyle = '#3fb950';
    ctx.fillRect(10, 10, state.profit * 200, 30);
  }
  requestAnimationFrame(render);
}
window.onload = render;
</script>
</body>
</html>
