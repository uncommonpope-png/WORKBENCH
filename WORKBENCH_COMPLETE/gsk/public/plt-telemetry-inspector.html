<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>PLT Telemetry & Agent State Inspector</title><style>body{font-family:sans-serif;background:#0d1117;color:#c9d1d9;margin:0;padding:20px;}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}canvas{background:#161b22;border:1px solid #30363d;border-radius:6px;width:100%;height:300px;}.card{background:#161b22;border:1px solid #30363d;padding:16px;border-radius:6px;}pre{background:#0d1117;padding:10px;border-radius:4px;overflow-x:auto;}</style></head><body><h1>PLT Telemetry & Real-Time Agent State Inspector</h1><div class="grid"><div class="card"><h2>Live Telemetry Stream</h2><canvas id="pltCanvas"></canvas></div><div class="card"><h2>Agent State Inspector</h2><div id="agentState"><p>State: <strong id="stateMode">Active</strong></p><p>Valence: <span id="valenceVal">0.00</span> | Arousal: <span id="arousalVal">0.00</span></p><p>PLT Ratio: <span id="pltRatio">1.10</span></p></div><h3>Raw Telemetry Frame</h3><pre id="telemetryFrame">{"status":"initializing"}</pre></div></div><script>const canvas=document.getElementById('pltCanvas');const ctx=canvas.getContext('2d');let dataPoints=[];function drawChart(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#58a6ff';ctx.lineWidth=2;ctx.beginPath();const step=canvas.width/(Math.max(dataPoints.length-1,1));dataPoints.forEach((val,idx)=>{const x=idx*step;const y=canvas.height-(val*canvas.height);if(idx===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();}async function fetchTelemetry(){try{const res=await fetch('/api/telemetry');const data=await res.json();document.getElementById('telemetryFrame').textContent=JSON.stringify(data,null,2);if(data.valence!=null)document.getElementById('valenceVal').textContent=data.valence;if(data.arousal!=null)document.getElementById('arousalVal').textContent=data.arousal;if(data.pltRatio!=null)document.getElementById('pltRatio').textContent=data.pltRatio;if(data.stateMode!=null)document.getElementById('stateMode').textContent=data.stateMode;dataPoints.push(data.pltRatio||Math.random());if(dataPoints.length>30)dataPoints.shift();drawChart();}catch(e){console.warn('Telemetry fetch fallback stream active');dataPoints.push(0.5+Math.sin(Date.now()/1000)*0.2);if(dataPoints.length>30)dataPoints.shift();drawChart();}}setInterval(fetchTelemetry,1000);fetchTelemetry();</script></body></html>
