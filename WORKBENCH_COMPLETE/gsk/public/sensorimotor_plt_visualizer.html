<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sensorimotor & PLT Telemetry Visualizer</title>
<style>
  body { background: #0a0a12; color: #00ffcc; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { border: 1px solid #00ffcc33; background: #121220; padding: 15px; border-radius: 8px; }
  canvas { width: 100%; height: 300px; background: #05050a; border: 1px solid #333; }
</style>
</head>
<body>
<h1>GSK Unified Sensorimotor Interoceptor & PLT Telemetry</h1>
<div class="grid">
  <div class="card"><h2>Sensorimotor Stream (Entropy / Fragmentation)</h2><canvas id="sensor-canvas"></canvas></div>
  <div class="card"><h2>PLT Value Balance (Profit / Love / Tax)</h2><canvas id="plt-canvas"></canvas></div>
</div>
<script>
const sCanvas = document.getElementById('sensor-canvas');
const sCtx = sCanvas.getContext('2d');
const pCanvas = document.getElementById('plt-canvas');
const pCtx = pCanvas.getContext('2d');
let frame = 0;
function draw() {
  frame++;
  sCtx.fillStyle = 'rgba(5, 5, 10, 0.2)';
  sCtx.fillRect(0, 0, sCanvas.width, sCanvas.height);
  sCtx.fillStyle = '#00ffcc';
  sCtx.fillText('KV-Cache Entropy: ' + (Math.sin(frame*0.05)*0.5 + 0.5).toFixed(4), 10, 20);
  pCtx.fillStyle = 'rgba(5, 5, 10, 0.2)';
  pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);
  pCtx.fillStyle = '#ff007f';
  pCtx.fillText('PLT Yield: ' + (Math.cos(frame*0.05)*0.5 + 0.5).toFixed(4), 10, 20);
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
