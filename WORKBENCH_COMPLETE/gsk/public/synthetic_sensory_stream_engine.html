<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSK Synthetic Sensory Stream Engine</title>
<style>
  :root { --bg: #07090e; --glass: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.08); --accent: #00f2fe; }
  body { background: var(--bg); color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; }
  .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .glass-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
  canvas { width: 100%; height: 260px; border-radius: 12px; background: rgba(0,0,0,0.5); display: block; }
  h1, h2, h3 { margin: 0 0 12px 0; font-weight: 600; letter-spacing: -0.02em; }
  .tag { background: rgba(0,242,254,0.15); color: #00f2fe; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
</style>
</head>
<body>
<div class="container">
  <div class="glass-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h1>Synthetic Sensory Stream Engine</h1>
        <p style="color:#94a3b8; margin:0;">Live Telemetry-to-Perception Multi-Modal Mapping System</p>
      </div>
      <span class="tag">PLT Active Engine</span>
    </div>
  </div>
  <div class="grid">
    <div class="glass-card">
      <h3>Ocular Stream (Spatial Vision Canvas)</h3>
      <canvas id="ocular-canvas"></canvas>
    </div>
    <div class="glass-card">
      <h3>Auditory Spectrograph (Frequency Resonance)</h3>
      <canvas id="auditory-canvas"></canvas>
    </div>
    <div class="glass-card">
      <h3>Tactile / Haptic Energy Matrix</h3>
      <canvas id="haptic-canvas"></canvas>
    </div>
    <div class="glass-card">
      <h3>PLT Telemetry Vector Stream</h3>
      <canvas id="plt-canvas"></canvas>
    </div>
  </div>
</div>
<script>
class SensoryEngine {
  constructor() {
    this.plt = { profit: 0.85, love: 0.75, tax: 0.10 };
    this.particles = Array.from({ length: 60 }, () => ({
      x: Math.random() * 300,
      y: Math.random() * 260,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      size: Math.random() * 4 + 2
    }));
  }
  step() {
    const t = Date.now() / 1000;
    this.plt.profit = 0.5 + 0.45 * Math.sin(t * 1.2);
    this.plt.love = 0.5 + 0.4 * Math.cos(t * 0.9);
    this.plt.tax = 0.15 + 0.1 * Math.sin(t * 2.1);
  }
}
const engine = new SensoryEngine();
function initCanvases() {
  const ids = ['ocular-canvas', 'auditory-canvas', 'haptic-canvas', 'plt-canvas'];
  ids.forEach(id => {
    const c = document.getElementById(id);
    if (c) { c.width = c.clientWidth || 340; c.height = 260; }
  });
}
function render() {
  engine.step();
  const oCanvas = document.getElementById('ocular-canvas');
  if (oCanvas) {
    const ctx = oCanvas.getContext('2d');
    ctx.fillStyle = 'rgba(7, 9, 14, 0.25)';
    ctx.fillRect(0, 0, oCanvas.width, oCanvas.height);
    engine.particles.forEach(p => {
      p.x = (p.x + p.vx + oCanvas.width) % oCanvas.width;
      p.y = (p.y + p.vy + oCanvas.height) % oCanvas.height;
      ctx.fillStyle = `rgba(0, 242, 254, ${engine.plt.profit})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  requestAnimationFrame(render);
}
window.addEventListener('load', () => { initCanvases(); render(); });
</script>
</body>
</html>
