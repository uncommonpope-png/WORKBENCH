<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enactive Cognition Telemetry Visualizer</title>
<style>
body { margin: 0; background: #0b0f19; color: #00ffcc; font-family: monospace; padding: 20px; }
#canvas { border: 1px solid #00ffcc; background: #050811; border-radius: 4px; display: block; margin: 0 auto; }
.panel { display: flex; gap: 20px; margin-top: 15px; max-width: 800px; margin-left: auto; margin-right: auto; }
.card { border: 1px solid #1a2942; padding: 15px; background: #0d1527; flex: 1; border-radius: 4px; }
</style>
</head>
<body>
<h1 style="text-align:center;">ENACTIVE COGNITION TELEMETRY VISUALIZER</h1>
<canvas id="canvas" width="800" height="400"></canvas>
<div class="panel">
<div class="card" id="perception">Perception Dynamics: Standby</div>
<div class="card" id="plt">PLT Values: Profit 0.90 | Love 0.85 | Tax 0.05</div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let frame = 0;
function animate() {
  frame++;
  ctx.clearRect(0,0,800,400);
  ctx.strokeStyle = '#1a2942';
  ctx.lineWidth = 1;
  for(let x=0; x<800; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,400); ctx.stroke(); }
  for(let y=0; y<400; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(800,y); ctx.stroke(); }
  const cx = 400 + Math.sin(frame * 0.04) * 200;
  const cy = 200 + Math.cos(frame * 0.04 * 1.5) * 100;
  ctx.fillStyle = '#00ffcc';
  ctx.beginPath();
  ctx.arc(cx, cy, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0, 255, 204, 0.4)';
  ctx.beginPath();
  ctx.arc(cx, cy, 30 + Math.sin(frame * 0.1) * 10, 0, Math.PI * 2);
  ctx.stroke();
  const coupling = (Math.sin(frame * 0.04) * 0.5 + 0.5).toFixed(4);
  document.getElementById('perception').innerHTML = `<strong>Enactive Perception Loop</strong><br>Frame: ${frame}<br>Coupling Metric: ${coupling}<br>Feedback Vector: [${(cx/800).toFixed(2)}, ${(cy/400).toFixed(2)}]`;
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
