<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Self-Model Telemetry Visualizer</title>
  <style>
    :root { --bg: #0b0c10; --card: #1f2833; --accent: #66fcf1; --text: #c5c6c7; }
    body { font-family: monospace; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: var(--accent); }
    .card { background: var(--card); padding: 15px; border-radius: 6px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Unified Self-Model Telemetry</h1>
    <div class="card" id="plt-state">PLT Telemetry Stream Initializing...</div>
  </div>
</body>
</html>
