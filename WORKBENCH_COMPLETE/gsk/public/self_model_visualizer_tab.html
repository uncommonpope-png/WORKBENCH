<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Self-Model Visualizer</title>
<style>
body { background: #0a0b10; color: #00ffcc; font-family: monospace; padding: 20px; }
.card { border: 1px solid #00ffcc; padding: 15px; margin-bottom: 15px; background: rgba(0,255,204,0.05); }
#canvas { border: 1px solid #334455; background: #050608; width: 100%; height: 400px; }
</style>
</head>
<body>
<h1>GSK Dynamic Self-Model Visualizer</h1>
<div class="card">
  <h3>Cognitive State & Core Memory Graph</h3>
  <canvas id="canvas" width="800" height="400"></canvas>
</div>
<div class="card" id="telemetry-status">
  <div>Valence: <span id="val">0.18</span> | Arousal: <span id="arousal">0.36</span> | Mood: <span id="mood">calm</span></div>
  <div>Active PLT Score: <span id="plt">0.85</span></div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#00ffcc';
  ctx.font = '16px monospace';
  ctx.fillText('Self-Model Node: [VOICE - PROFIT BIBLE LOCKED]', 40, 50);
  ctx.fillText('Cognitive State: Integrated', 40, 90);
  ctx.beginPath();
  ctx.arc(400, 200, 50, 0, Math.PI * 2);
  ctx.strokeStyle = '#00ffcc';
  ctx.stroke();
}
setInterval(render, 1000);
render();
</script>
</body>
</html>
