<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Multi-Agent Neural Dynamics PLT Visualizer</title><style>body{margin:0;background:#06060c;color:#e0e0e0;font-family:'Courier New',monospace;overflow:hidden}#canvas{width:100vw;height:100vh;display:block}#ui-overlay{position:absolute;top:20px;left:20px;z-index:10;background:rgba(10,10,20,0.85);padding:15px;border:1px solid #00ffcc;border-radius:6px;box-shadow:0 0 15px rgba(0,255,204,0.2)}h2{margin:0 0 10px 0;font-size:16px;color:#00ffcc;letter-spacing:1px}.stat-line{font-size:12px;margin:4px 0}</style></head><body><div id="ui-overlay"><h2>GSK NEURAL DYNAMICS TELEMETRY</h2><div id="stats">Initializing multi-agent neural network stream...</div></div><canvas id="canvas"></canvas><script>const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d'); const statsEl = document.getElementById('stats'); function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; } window.addEventListener('resize', resize); resize(); class CouncilAgent { constructor(id, name, color, x, y){ this.id = id; this.name = name; this.color = color; this.x = x; this.y = y; this.vx = (Math.random()-0.5)*1.5; this.vy = (Math.random()-0.5)*1.5; this.spikes = []; this.profit = 0.5; this.love = 0.5; this.tax = 0.1; } update(){ this.x += this.vx; this.y += this.vy; if(this.x < 100 || this.x > canvas.width - 100) this.vx *= -1; if(this.y < 100 || this.y > canvas.height - 100) this.vy *= -1; this.profit = Math.min(1.0, Math.max(0.05, this.profit + (Math.random() - 0.48) * 0.03)); this.love = Math.min(1.0, Math.max(0.05, this.love + (Math.random() - 0.47) * 0.03)); this.tax = Math.min(0.8, Math.max(0.01, this.tax + (Math.random() - 0.5) * 0.01)); if(Math.random() < 0.3){ this.spikes.push({ r: 5, alpha: 1.0 }); } this.spikes.forEach(s => { s.r += 2; s.alpha -= 0.03; }); this.spikes = this.spikes.filter(s => s.alpha > 0); } get trueValue(){ return this.profit + this.love - this.tax; } } const agents = [ new CouncilAgent(1, 'Profit Prime', '#00ffcc', canvas.width*0.3, canvas.height*0.35), new CouncilAgent(2, 'Love Weaver', '#ff00aa', canvas.width*0.7, canvas.height*0.35), new CouncilAgent(3, 'Tax Collector', '#ffcc00', canvas.width*0.5, canvas.height*0.7) ];function draw(){ ctx.fillStyle = 'rgba(6, 6, 12, 0.25)'; ctx.fillRect(0,0,canvas.width,canvas.height); for(let i=0; i<agents.length; i++){ for(let j=i+1; j<agents.length; j++){ const a1 = agents[i]; const a2 = agents[j]; ctx.beginPath(); ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y); ctx.strokeStyle = 'rgba(0,255,204,0.15)'; ctx.lineWidth = 1; ctx.stroke(); } } let statsHTML = ''; agents.forEach(a => { a.update(); const tv = a.trueValue; ctx.beginPath(); ctx.arc(a.x, a.y, Math.max(12, tv * 20), 0, Math.PI*2); ctx.fillStyle = a.color; ctx.fill(); a.spikes.forEach(s => { ctx.beginPath(); ctx.arc(a.x, a.y, s.r, 0, Math.PI*2); ctx.strokeStyle = a.color; ctx.globalAlpha = s.alpha; ctx.stroke(); ctx.globalAlpha = 1.0; }); ctx.fillStyle = '#ffffff'; ctx.font = '12px monospace'; ctx.fillText(`${a.name} [TV: ${tv.toFixed(2)}]`, a.x - 40, a.y + 30); statsHTML += `<div class="stat-line"><span style="color:${a.color}">${a.name}</span>: P=${a.profit.toFixed(2)} | L=${a.love.toFixed(2)} | T=${a.tax.toFixed(2)} => TV=${tv.toFixed(2)}</div>`; }); statsEl.innerHTML = statsHTML; requestAnimationFrame(draw); } draw(); </script></body></html>
