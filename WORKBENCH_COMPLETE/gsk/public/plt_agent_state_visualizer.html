<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PLT Real-Time Agent State Visualizer</title>
<style>
  body { margin: 0; background: #0a0b10; color: #00ffcc; font-family: monospace; overflow: hidden; }
  #canvas { width: 100vw; height: 100vh; display: block; }
  .overlay { position: absolute; top: 15px; left: 15px; background: rgba(10,11,16,0.85); padding: 15px; border: 1px solid #00ffcc; border-radius: 6px; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
  .metric { margin-bottom: 8px; font-size: 14px; }
  .val { color: #fff; font-weight: bold; }
</style>
</head>
<body>
<div class="overlay">
  <h3>PLT Manifold Visualizer</h3>
  <div class="metric">Profit Rate: <span id="profit" class="val">0.95</span></div>
  <div class="metric">Love Resonance: <span id="love" class="val">0.98</span></div>
  <div class="metric">Tax Drag: <span id="tax" class="val">0.02</span></div>
</div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();
const nodes = Array.from({length: 20}, (_, i) => ({ id: i, x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2 }));
function draw() {
  ctx.fillStyle = '#0a0b10'; ctx.fillRect(0,0,canvas.width,canvas.height);
  nodes.forEach(n => {
    n.x += n.vx; n.y += n.vy;
    if(n.x<0||n.x>canvas.width) n.vx*=-1;
    if(n.y<0||n.y>canvas.height) n.vy*=-1;
    ctx.fillStyle = '#00ffcc'; ctx.beginPath(); ctx.arc(n.x, n.y, 5, 0, Math.PI*2); ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
