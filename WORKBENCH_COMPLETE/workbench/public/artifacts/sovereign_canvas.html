<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sovereign Telemetry Canvas â€” GSK Crucible Phase 5</title>
<style>
  html,body{margin:0;height:100%;background:#030308;overflow:hidden}
  #mount{width:100vw;height:100vh}
</style>
</head>
<body>
<div id="mount"></div>
<script type="module">
  import THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
  const mod = await import('/artifacts/sovereign_telemetry.mjs');
  const Engine = mod.default;
  const engine = new Engine(document.getElementById('mount'));
  if (engine.start) engine.start();

  // Live telemetry feed â€” simulates chamber IPC stream
  let t = 0;
  setInterval(() => {
    t += 0.15;
    const chambers = [];
    for (let i = 0; i < 34; i++) {
      chambers.push({
        chamberId: i,
        valence: 0.5 + 0.4 * Math.sin(t + i * 0.37),
        arousal: 0.5 + 0.3 * Math.cos(t * 0.7 + i),
        taxLevel: Math.max(0, 0.2 + 0.25 * Math.sin(t * 1.3 + i * 1.7)),
        activeWorkers: 1 + (i % 13),
        ipcFrequency: 1 + Math.abs(Math.sin(t + i)) * 8,
      });
    }
    if (engine.updateTelemetry) engine.updateTelemetry(chambers);
    else if (engine.telemetry) engine.telemetry(chambers);
  }, 120);
</script>
</body>
</html>
